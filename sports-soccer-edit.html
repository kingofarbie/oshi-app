<div class="soccer-edit-screen">

    <!-- =========================
         タイトル
    ========================== -->
    <h2 id="soccerGameEditTitle">⚽ 試合結果</h2>


    <!-- =========================
         応援チーム
         右端でホーム / アウェイ選択
    ========================== -->
    <div class="soccer-team-input-section">

        <label for="soccerEditTeam">
            応援チーム名
        </label>

        <div class="soccer-team-input-row">

            <input
                type="text"
                id="soccerEditTeam"
                placeholder="応援チーム名"
            >

            <select id="soccerEditHomeAway">
                <option value="home">ホーム</option>
                <option value="away">アウェイ</option>
            </select>

        </div>

    </div>


    <!-- =========================
         対戦チーム
    ========================== -->
    <div class="soccer-team-input-section">

        <label for="soccerEditOpponent">
            対戦チーム
        </label>

        <input
            type="text"
            id="soccerEditOpponent"
            placeholder="対戦チーム名"
        >

    </div>


    <!-- =========================
         試合表示
         ホーム / アウェイ
         リアルタイム得点
    ========================== -->
    <div class="soccer-match-display">

        <div class="soccer-match-teams">

            <div class="soccer-match-team">

                <div class="soccer-match-homeaway">
                    ホーム
                </div>

                <div
                    class="soccer-match-team-name"
                    data-soccer-home-name
                >
                    ○○チーム
                </div>

            </div>


            <div class="soccer-match-team">

                <div class="soccer-match-homeaway">
                    アウェイ
                </div>

                <div
                    class="soccer-match-team-name"
                    data-soccer-away-name
                >
                    △△チーム
                </div>

            </div>

        </div>


        <!-- リアルタイム反映得点 -->
        <div class="soccer-live-score">

            <input
                type="number"
                id="soccerEditFinalTeamScore"
                readonly
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditFinalOpponentScore"
                readonly
            >

        </div>

        <div class="soccer-live-score-label">
            リアルタイム反映
        </div>

    </div>


    <!-- =========================
         前半
    ========================== -->
    <div class="soccer-score-section">

        <div class="soccer-score-row">

            <div class="soccer-score-period">
                前半
            </div>

            <input
                type="number"
                id="soccerEditFirstHalfTeam"
                min="0"
                inputmode="numeric"
                placeholder="0"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditFirstHalfOpponent"
                min="0"
                inputmode="numeric"
                placeholder="0"
            >

        </div>

    </div>


    <!-- =========================
         後半
    ========================== -->
    <div class="soccer-score-section">

        <div class="soccer-score-row">

            <div class="soccer-score-period">
                後半
            </div>

            <input
                type="number"
                id="soccerEditSecondHalfTeam"
                min="0"
                inputmode="numeric"
                placeholder="0"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditSecondHalfOpponent"
                min="0"
                inputmode="numeric"
                placeholder="0"
            >

        </div>

    </div>


    <!-- =========================
         延長戦
    ========================== -->
    <div class="soccer-extra-section">

        <label class="soccer-checkbox-row">

            <input
                type="checkbox"
                id="soccerEditExtraTime"
            >

            <span>延長戦</span>

        </label>


        <div
            id="soccerEditExtraTimeArea"
            class="soccer-extra-time-area"
        >

            <!-- 延長前半 -->
            <div class="soccer-score-row">

                <div class="soccer-score-period">
                    延長前半
                </div>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfTeam"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfOpponent"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

            </div>


            <!-- 延長後半 -->
            <div class="soccer-score-row">

                <div class="soccer-score-period">
                    延長後半
                </div>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfTeam"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfOpponent"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         PK戦
    ========================== -->
    <div class="soccer-penalty-section">

        <label class="soccer-checkbox-row">

            <input
                type="checkbox"
                id="soccerEditPenaltyShootout"
            >

            <span>PK戦</span>

        </label>


        <div
            id="soccerEditPenaltyArea"
            class="soccer-penalty-area"
        >

            <div class="soccer-score-row">

                <div class="soccer-score-period">
                    PK
                </div>

                <input
                    type="number"
                    id="soccerEditPenaltyTeam"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditPenaltyOpponent"
                    min="0"
                    inputmode="numeric"
                    placeholder="0"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         試合結果
    ========================== -->
    <div class="soccer-result-section">

        <label for="soccerEditResult">
            結果
        </label>

        <select id="soccerEditResult">

            <option value="">
                自動判定
            </option>

            <option value="win">
                勝ち
            </option>

            <option value="draw">
                引き分け
            </option>

            <option value="lose">
                負け
            </option>

            <option value="pk_win">
                PK勝ち
            </option>

            <option value="pk_lose">
                PK負け
            </option>

        </select>

    </div>


    <!-- =========================
         場所
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditLocation">
            場所
        </label>

        <input
            type="text"
            id="soccerEditLocation"
            placeholder="試合会場"
        >

    </div>


    <!-- =========================
         先発
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditStartingPlayer">
            先発
        </label>

        <input
            type="text"
            id="soccerEditStartingPlayer"
            placeholder="先発選手"
        >

    </div>


    <!-- =========================
         相手先発
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditOpponentStartingPlayer">
            相手先発
        </label>

        <input
            type="text"
            id="soccerEditOpponentStartingPlayer"
            placeholder="相手先発選手"
        >

    </div>


    <!-- =========================
         メモ
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditMemo">
            メモ
        </label>

        <textarea
            id="soccerEditMemo"
            rows="4"
            placeholder="メモ"
        ></textarea>

    </div>


    <!-- =========================
         ボタン
    ========================== -->
    <div class="soccer-edit-buttons">

        <button
            type="button"
            onclick="closeSoccerGameEditPage()"
        >
            キャンセル
        </button>

        <button
            type="button"
            onclick="saveSoccerGameFromEditPage()"
        >
            保存
        </button>

    </div>

</div>
