<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>サッカー試合結果 | 推し活手帳</title>

    <link rel="stylesheet" href="calendar-sports.css">
    <link rel="stylesheet" href="sports-soccer.css">

</head>

<body>

<div id="soccerGameEditScreen">

    <!-- =================================================
         ヘッダー
    ================================================== -->

    <header class="sports-calendar-header">

        <h1
            id="soccerGameEditTitle"
            class="sports-calendar-title"
        >
            ⚽ 試合結果編集
        </h1>

        <button
            type="button"
            class="sports-back-button"
            onclick="closeSoccerGameEditPage()"
        >
            ◀ カレンダーへ戻る
        </button>

    </header>


    <main
        id="sportsGameEditForm"
        class="sports-game-edit-form"
    >


        <!-- =================================================
             試合情報
        ================================================== -->

        <section class="sports-edit-section">

            <h2>⚽ 試合情報</h2>


            <label for="soccerEditTeam">
                自分の応援チーム
            </label>

            <input
                type="text"
                id="soccerEditTeam"
                placeholder="応援チーム名"
                autocomplete="off"
            >


            <label for="soccerEditOpponent">
                相手チーム
            </label>

            <input
                type="text"
                id="soccerEditOpponent"
                placeholder="相手チーム名"
                autocomplete="off"
            >


            <label for="soccerEditLocation">
                📍 場所
            </label>

            <input
                type="text"
                id="soccerEditLocation"
                placeholder="スタジアム・会場名"
                autocomplete="off"
            >

        </section>



        <!-- =================================================
             スコアボード
        ================================================== -->

        <section class="sports-edit-section">

            <h2>📊 スコアボード</h2>


            <div class="soccer-scoreboard">


                <!-- =========================
                     チーム名・最終スコア
                ========================== -->

                <div class="soccer-score-header">

                    <div
                        id="soccerEditScoreTeamName"
                        class="soccer-score-team-name"
                    >
                        応援チーム
                    </div>


                    <div class="soccer-score-final">

                        <strong
                            id="soccerEditFinalTeamScore"
                        >
                            0
                        </strong>

                        <span>-</span>

                        <strong
                            id="soccerEditFinalOpponentScore"
                        >
                            0
                        </strong>

                    </div>


                    <div
                        id="soccerEditScoreOpponentName"
                        class="soccer-score-team-name"
                    >
                        相手チーム
                    </div>

                </div>



                <!-- =========================
                     前半
                ========================== -->

                <div
                    class="soccer-score-row"
                    data-period="firstHalf"
                >

                    <div class="soccer-score-period">
                        前半
                    </div>

                    <input
                        id="soccerEditTeamFirstHalf"
                        class="soccer-score-input"
                        type="number"
                        min="0"
                        inputmode="numeric"
                    >

                    <span class="soccer-score-dash">
                        -
                    </span>

                    <input
                        id="soccerEditOpponentFirstHalf"
                        class="soccer-score-input"
                        type="number"
                        min="0"
                        inputmode="numeric"
                    >

                </div>



                <!-- =========================
                     後半
                ========================== -->

                <div
                    class="soccer-score-row"
                    data-period="secondHalf"
                >

                    <div class="soccer-score-period">
                        後半
                    </div>

                    <input
                        id="soccerEditTeamSecondHalf"
                        class="soccer-score-input"
                        type="number"
                        min="0"
                        inputmode="numeric"
                    >

                    <span class="soccer-score-dash">
                        -
                    </span>

                    <input
                        id="soccerEditOpponentSecondHalf"
                        class="soccer-score-input"
                        type="number"
                        min="0"
                        inputmode="numeric"
                    >

                </div>



                <!-- =================================================
                     追加される行
                ================================================== -->

                <div
                    id="soccerExtraPeriods"
                    class="soccer-extra-periods"
                ></div>



                <!-- =========================
                     計
                ========================== -->

                <div class="soccer-score-total-row">

                    <div class="soccer-score-period">
                        計
                    </div>

                    <strong
                        id="soccerEditTeamTotal"
                    >
                        0
                    </strong>

                    <span class="soccer-score-dash">
                        -
                    </span>

                    <strong
                        id="soccerEditOpponentTotal"
                    >
                        0
                    </strong>

                </div>


            </div>



            <!-- =================================================
                 追加ボタン
            ================================================== -->

            <div class="soccer-add-period-area">

                <button
                    type="button"
                    id="soccerAddPeriodButton"
                    onclick="addSoccerExtraPeriod()"
                >
                    ＋ 延長前半を追加
                </button>

            </div>


        </section>



        <!-- =================================================
             試合結果
        ================================================== -->

        <section class="sports-edit-section">

            <h2>🏆 試合結果</h2>


            <label for="soccerEditResult">
                勝敗
            </label>

            <select id="soccerEditResult">

                <option value="">
                    未設定
                </option>

                <option value="win">
                    🏆 勝ち
                </option>

                <option value="lose">
                    😢 負け
                </option>

                <option value="draw">
                    🤝 引き分け
                </option>

                <option value="cancelled">
                    ⛔ 中止
                </option>

            </select>

        </section>



        <!-- =================================================
             メモ
        ================================================== -->

        <section class="sports-edit-section">

            <h2>📝 メモ</h2>

            <textarea
                id="soccerEditMemo"
                rows="5"
                placeholder="試合についてのメモ"
            ></textarea>

        </section>



        <!-- =================================================
             ボタン
        ================================================== -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                onclick="saveSoccerGameEdit()"
            >
                💾 保存
            </button>


            <button
                type="button"
                onclick="cancelSoccerGameEdit()"
            >
                キャンセル
            </button>

        </div>


    </main>

</div>

</body>

</html>
