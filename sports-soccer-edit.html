<div id="soccerGameEditScreen" class="sports-edit-screen">

    <header class="sports-edit-header">
        <button type="button"
                class="sports-back-button"
                onclick="closeSoccerGameEditPage()">
            ← 戻る
        </button>

        <h1 id="soccerGameEditTitle" class="sports-calendar-title">
            ⚽ 試合結果編集
        </h1>
    </header>


    <main id="soccerGameEditForm"
          class="sports-soccer-edit-form">


        <!-- =========================
             基本情報
        ========================== -->

        <section class="sports-edit-section">

            <div class="sports-edit-row">

                <label>
                    チーム
                    <input
                        type="text"
                        id="soccerEditTeam"
                        placeholder="チーム名">
                </label>

            </div>


            <div class="sports-edit-row">

                <label>
                    対戦相手
                    <input
                        type="text"
                        id="soccerEditOpponent"
                        placeholder="対戦相手">
                </label>

            </div>


            <div class="sports-edit-row">

                <label>
                    ホーム / アウェイ

                    <select id="soccerEditHomeAway">

                        <option value="home">
                            ホーム
                        </option>

                        <option value="away">
                            アウェイ
                        </option>

                    </select>

                </label>

            </div>


            <div class="sports-edit-row">

                <label>
                    会場
                    <input
                        type="text"
                        id="soccerEditLocation"
                        placeholder="会場">
                </label>

            </div>

        </section>



        <!-- =========================
             スコア
        ========================== -->

        <section class="sports-edit-section">

            <h2>⚽ スコア</h2>


            <div class="soccer-scoreboard">

                <div class="soccer-score-final">

                    <div
                        class="soccer-score-team"
                        data-soccer-team-name>
                        チーム
                    </div>

                    <strong id="soccerEditFinalTeamScore">
                        0
                    </strong>

                    <span> - </span>

                    <strong id="soccerEditFinalOpponentScore">
                        0
                    </strong>

                    <div
                        class="soccer-score-team"
                        data-soccer-opponent-name>
                        対戦相手
                    </div>

                </div>


                <!-- 前半・後半 -->

                <table class="soccer-score-table">

                    <thead>
                        <tr>
                            <th></th>
                            <th data-soccer-team-name>
                                チーム
                            </th>
                            <th data-soccer-opponent-name>
                                対戦相手
                            </th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr id="soccerEditTeamRow">

                            <td>
                                前半
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    id="soccerEditFirstHalfTeam"
                                    value="0">
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    id="soccerEditFirstHalfOpponent"
                                    value="0">
                            </td>

                        </tr>


                        <tr id="soccerEditOpponentRow">

                            <td>
                                後半
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    id="soccerEditSecondHalfTeam"
                                    value="0">
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    id="soccerEditSecondHalfOpponent"
                                    value="0">
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>



        <!-- =========================
             延長戦
        ========================== -->

        <section class="sports-edit-section">

            <label class="sports-checkbox-row">

                <input
                    type="checkbox"
                    id="soccerEditExtraTime"
                    onchange="toggleSoccerExtraPeriods()">

                延長戦あり

            </label>


            <div id="soccerEditExtraTimeArea">

                <!-- JSで表示 -->

            </div>

        </section>



        <!-- =========================
             PK戦
        ========================== -->

        <section class="sports-edit-section">

            <label class="sports-checkbox-row">

                <input
                    type="checkbox"
                    id="soccerEditPenaltyShootout"
                    onchange="toggleSoccerPenalty()">

                PK戦あり

            </label>


            <div id="soccerEditPenaltyArea">

                <!-- JSで表示 -->

            </div>

        </section>



        <!-- =========================
             合計
        ========================== -->

        <section class="sports-edit-section">

            <div class="soccer-total-score">

                <span data-soccer-team-name>
                    チーム
                </span>

                <strong id="soccerEditTeamTotal">
                    0
                </strong>

                <span> - </span>

                <strong id="soccerEditOpponentTotal">
                    0
                </strong>

                <span data-soccer-opponent-name>
                    対戦相手
                </span>

            </div>

        </section>



        <!-- =========================
             結果
        ========================== -->

        <section class="sports-edit-section">

            <label>
                結果

                <select id="soccerEditResult">

                    <option value="">
                        自動判定
                    </option>

                    <option value="win">
                        勝利
                    </option>

                    <option value="draw">
                        引き分け
                    </option>

                    <option value="loss">
                        敗戦
                    </option>

                </select>

            </label>

        </section>



        <!-- =========================
             メモ
        ========================== -->

        <section class="sports-edit-section">

            <label>
                メモ

                <textarea
                    id="soccerEditMemo"
                    rows="4"
                    placeholder="メモ"></textarea>

            </label>

        </section>



        <!-- =========================
             ボタン
        ========================== -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                class="sports-save-button"
                onclick="saveSoccerGameFromEditPage()">

                💾 保存

            </button>


            <button
                type="button"
                class="sports-cancel-button"
                onclick="closeSoccerGameEditPage()">

                キャンセル

            </button>

        </div>


    </main>

</div>
