<div class="soccer-edit-screen">

    <h2 id="soccerGameEditTitle">⚽ 試合結果</h2>

    <!-- =========================
         ホーム / アウェイ
    ========================== -->
    <div class="soccer-teams">

        <div class="soccer-team-column">
            <div class="soccer-team-label">ホーム</div>

            <input
                type="text"
                id="soccerEditTeam"
                placeholder="ホームチーム"
            >
        </div>

        <div class="soccer-team-column">
            <div class="soccer-team-label">アウェイ</div>

            <input
                type="text"
                id="soccerEditOpponent"
                placeholder="アウェイチーム"
            >
        </div>

    </div>


    <!-- ホーム / アウェイ変更 -->
    <div class="soccer-home-away-switch">

        <button
            type="button"
            id="soccerHomeAwaySwitchButton"
            onclick="swapSoccerHomeAwayScores()"
        >
            ホーム ⇄ アウェイ
        </button>

    </div>


    <!-- =========================
         現在スコア
         自動計算
    ========================== -->
    <div class="soccer-current-score">

        <div class="soccer-score-label">
            現在スコア
        </div>

        <div class="soccer-score-row soccer-score-auto">

            <input
                type="number"
                id="soccerEditFinalTeamScore"
                readonly
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditFinalOpponentScore"
                readonly
            >

        </div>

        <div class="soccer-auto-note">
            ※ 前半・後半・延長戦から自動計算
        </div>

    </div>


    <!-- =========================
         前半
    ========================== -->
    <div class="soccer-score-section">

        <div class="soccer-score-row">

            <label>前半</label>

            <input
                type="number"
                id="soccerEditFirstHalfTeam"
                min="0"
                inputmode="numeric"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditFirstHalfOpponent"
                min="0"
                inputmode="numeric"
            >

        </div>

    </div>


    <!-- =========================
         後半
    ========================== -->
    <div class="soccer-score-section">

        <div class="soccer-score-row">

            <label>後半</label>

            <input
                type="number"
                id="soccerEditSecondHalfTeam"
                min="0"
                inputmode="numeric"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditSecondHalfOpponent"
                min="0"
                inputmode="numeric"
            >

        </div>

    </div>


    <!-- =========================
         延長戦
    ========================== -->
    <div class="soccer-extra-section">

        <label class="soccer-check-label">

            <input
                type="checkbox"
                id="soccerEditExtraTime"
            >

            <span>延長戦</span>

        </label>


        <div
            id="soccerEditExtraTimeArea"
            class="soccer-extra-time-area"
            style="display:none;"
        >

            <div class="soccer-score-row">

                <label>延長前半</label>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>


            <div class="soccer-score-row">

                <label>延長後半</label>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         PK戦
    ========================== -->
    <div class="soccer-penalty-section">

        <label class="soccer-check-label">

            <input
                type="checkbox"
                id="soccerEditPenaltyShootout"
            >

            <span>PK戦</span>

        </label>


        <div
            id="soccerEditPenaltyArea"
            class="soccer-penalty-area"
            style="display:none;"
        >

            <div class="soccer-score-row">

                <label>PK</label>

                <input
                    type="number"
                    id="soccerEditPenaltyTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditPenaltyOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         合計
         自動計算
    ========================== -->
    <div class="soccer-total-section">

        <div class="soccer-total-title">
            合計
        </div>

        <div class="soccer-total-teams">

            <span
                data-soccer-home-name
            >
                ○○チーム
            </span>

            <span
                data-soccer-away-name
            >
                △△チーム
            </span>

        </div>


        <div class="soccer-score-row soccer-score-auto">

            <input
                type="number"
                id="soccerEditTeamTotal"
                readonly
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditOpponentTotal"
                readonly
            >

        </div>

        <div class="soccer-auto-note">
            ※ 自動計算
        </div>

    </div>


    <!-- =========================
         結果
    ========================== -->
    <div class="soccer-result-section">

        <label for="soccerEditResult">
            試合結果
        </label>

        <select id="soccerEditResult">

            <option value="">
                自動判定
            </option>

            <option value="win">
                勝ち
            </option>

            <option value="draw">
                引き分け
            </option>

            <option value="lose">
                負け
            </option>

            <option value="pk_win">
                PK勝ち
            </option>

            <option value="pk_lose">
                PK負け
            </option>

        </select>

    </div>


    <!-- =========================
         場所
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditLocation">
            場所
        </label>

        <input
            type="text"
            id="soccerEditLocation"
            placeholder="試合会場"
        >

    </div>


    <!-- =========================
         先発
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditStartingPlayer">
            先発
        </label>

        <input
            type="text"
            id="soccerEditStartingPlayer"
            placeholder="先発選手"
        >

    </div>


    <!-- =========================
         相手先発
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditOpponentStartingPlayer">
            相手先発
        </label>

        <input
            type="text"
            id="soccerEditOpponentStartingPlayer"
            placeholder="相手先発選手"
        >

    </div>


    <!-- =========================
         メモ
    ========================== -->
    <div class="soccer-info-section">

        <label for="soccerEditMemo">
            メモ
        </label>

        <textarea
            id="soccerEditMemo"
            placeholder="メモ"
            rows="4"
        ></textarea>

    </div>


    <!-- =========================
         ボタン
    ========================== -->
    <div class="soccer-edit-buttons">

        <button
            type="button"
            onclick="closeSoccerGameEditPage()"
        >
            キャンセル
        </button>

        <button
            type="button"
            onclick="saveSoccerGameFromEditPage()"
        >
            保存
        </button>

    </div>

</div>
