<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>サッカー試合結果編集</title></head><body><div
    id="soccerGameEditForm"
    class="sports-edit-screen"
><!-- =================================================
     タイトル
================================================= -->

<h1 id="soccerGameEditTitle">
    ⚽ 試合結果編集
</h1>


<!-- =================================================
     ホーム / アウェイ
================================================= -->

<div class="soccer-home-away-header">

    <div class="soccer-side soccer-home">

        <div class="soccer-side-label">
            ホーム
        </div>

        <div
            class="soccer-team-name"
            data-soccer-home-name
        >
            応援チーム
        </div>

    </div>


    <div class="soccer-home-away-switch">

        <select
            id="soccerEditHomeAway"
            aria-label="ホーム・アウェイ"
        >

            <option value="home">
                ホーム
            </option>

            <option value="away">
                アウェイ
            </option>

        </select>

    </div>


    <div class="soccer-side soccer-away">

        <div class="soccer-side-label">
            アウェイ
        </div>

        <div
            class="soccer-team-name"
            data-soccer-away-name
        >
            相手チーム
        </div>

    </div>

</div>


<!-- =================================================
     チーム名入力
     
     内部データ用。
     表示上必要なければCSSで非表示可能。
================================================= -->

<div class="soccer-team-input-area">

    <div class="soccer-team-input">

        <label for="soccerEditTeam">
            応援チーム
        </label>

        <input
            type="text"
            id="soccerEditTeam"
            placeholder="応援チーム名"
        >

    </div>


    <div class="soccer-team-input">

        <label for="soccerEditOpponent">
            相手チーム
        </label>

        <input
            type="text"
            id="soccerEditOpponent"
            placeholder="相手チーム名"
        >

    </div>

</div>


<!-- =================================================
     メインスコア
================================================= -->

<div class="soccer-main-score">

    <div class="soccer-score-box">

        <span
            class="soccer-score-team"
            data-soccer-home-name
        >
            応援チーム
        </span>


        <input
            type="number"
            id="soccerEditFinalTeamScore"
            value="0"
            min="0"
            readonly
        >

    </div>


    <div class="soccer-score-separator">
        －
    </div>


    <div class="soccer-score-box">

        <input
            type="number"
            id="soccerEditFinalOpponentScore"
            value="0"
            min="0"
            readonly
        >


        <span
            class="soccer-score-team"
            data-soccer-away-name
        >
            相手チーム
        </span>

    </div>

</div>


<!-- =================================================
     前半
================================================= -->

<div class="soccer-score-row">

    <div class="soccer-score-label">
        前半
    </div>


    <div class="soccer-score-inputs">

        <input
            type="number"
            id="soccerEditFirstHalfTeam"
            min="0"
            inputmode="numeric"
        >


        <span>
            －
        </span>


        <input
            type="number"
            id="soccerEditFirstHalfOpponent"
            min="0"
            inputmode="numeric"
        >

    </div>

</div>


<!-- =================================================
     後半
================================================= -->

<div class="soccer-score-row">

    <div class="soccer-score-label">
        後半
    </div>


    <div class="soccer-score-inputs">

        <input
            type="number"
            id="soccerEditSecondHalfTeam"
            min="0"
            inputmode="numeric"
        >


        <span>
            －
        </span>


        <input
            type="number"
            id="soccerEditSecondHalfOpponent"
            min="0"
            inputmode="numeric"
        >

    </div>

</div>


<!-- =================================================
     延長戦
================================================= -->

<div class="soccer-option-section">

    <label class="soccer-checkbox-row">

        <input
            type="checkbox"
            id="soccerEditExtraTime"
        >

        <span>
            延長戦
        </span>

    </label>


    <div
        id="soccerEditExtraTimeArea"
        class="soccer-extra-time-area"
        style="display:none;"
    >

        <!-- 延長前半 -->

        <div class="soccer-score-row">

            <div class="soccer-score-label">
                延長前半
            </div>


            <div class="soccer-score-inputs">

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfTeam"
                    min="0"
                    inputmode="numeric"
                >


                <span>
                    －
                </span>


                <input
                    type="number"
                    id="soccerEditExtraFirstHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>


        <!-- 延長後半 -->

        <div class="soccer-score-row">

            <div class="soccer-score-label">
                延長後半
            </div>


            <div class="soccer-score-inputs">

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfTeam"
                    min="0"
                    inputmode="numeric"
                >


                <span>
                    －
                </span>


                <input
                    type="number"
                    id="soccerEditExtraSecondHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>

</div>


<!-- =================================================
     PK戦
================================================= -->

<div class="soccer-option-section">

    <label class="soccer-checkbox-row">

        <input
            type="checkbox"
            id="soccerEditPenaltyShootout"
        >

        <span>
            PK戦
        </span>

    </label>


    <div
        id="soccerEditPenaltyArea"
        class="soccer-penalty-area"
        style="display:none;"
    >

        <div class="soccer-score-row">

            <div class="soccer-score-label">
                PK
            </div>


            <div class="soccer-score-inputs">

                <input
                    type="number"
                    id="soccerEditPenaltyTeam"
                    min="0"
                    inputmode="numeric"
                >


                <span>
                    －
                </span>


                <input
                    type="number"
                    id="soccerEditPenaltyOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>


        <div
            id="soccerEditPenaltyPreview"
            class="soccer-penalty-preview"
        ></div>

    </div>

</div>


<!-- =================================================
     合計
     
     PKは含まない
================================================= -->

<div class="soccer-total-section">

    <div class="soccer-total-title">
        合計
    </div>


    <div class="soccer-total-score">

        <div class="soccer-total-side">

            <span
                data-soccer-home-name
            >
                応援チーム
            </span>


            <span
                id="soccerEditTeamTotal"
                data-soccer-left-total
            >
                0
            </span>

        </div>


        <div class="soccer-total-separator">
            －
        </div>


        <div class="soccer-total-side">

            <span
                data-soccer-away-name
            >
                相手チーム
            </span>


            <span
                id="soccerEditOpponentTotal"
                data-soccer-right-total
            >
                0
            </span>

        </div>

    </div>

</div>


<!-- =================================================
     勝敗
================================================= -->

<div class="soccer-result-section">

    <label for="soccerEditResult">
        結果
    </label>


    <select
        id="soccerEditResult"
    >

        <option value="">
            自動判定
        </option>

        <option value="win">
            勝ち
        </option>

        <option value="lose">
            負け
        </option>

        <option value="draw">
            引き分け
        </option>

    </select>

</div>


<!-- =================================================
     場所
================================================= -->

<div class="soccer-info-section">

    <label for="soccerEditLocation">
        場所
    </label>


    <input
        type="text"
        id="soccerEditLocation"
        placeholder="試合会場"
    >

</div>


<!-- =================================================
     先発
================================================= -->

<div class="soccer-info-section">

    <label for="soccerEditStartingPlayer">
        先発
    </label>


    <textarea
        id="soccerEditStartingPlayer"
        placeholder="先発メンバー"
    ></textarea>

</div>


<!-- =================================================
     相手先発
================================================= -->

<div class="soccer-info-section">

    <label for="soccerEditOpponentStartingPlayer">
        相手先発
    </label>


    <textarea
        id="soccerEditOpponentStartingPlayer"
        placeholder="相手チームの先発メンバー"
    ></textarea>

</div>


<!-- =================================================
     メモ
================================================= -->

<div class="soccer-info-section">

    <label for="soccerEditMemo">
        メモ
    </label>


    <textarea
        id="soccerEditMemo"
        placeholder="メモ"
    ></textarea>

</div>


<!-- =================================================
     ボタン
================================================= -->

<div class="soccer-edit-buttons">

    <button
        type="button"
        onclick="closeSoccerGameEditPage()"
    >
        キャンセル
    </button>


    <button
        type="button"
        onclick="saveSoccerGameFromEditPage()"
    >
        保存
    </button>

</div>

</div></body></html>
