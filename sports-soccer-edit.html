<form id="soccerGameEditForm" class="soccer-edit-screen">

    <h2 id="soccerGameEditTitle">⚽ 試合結果</h2>


    <!-- チーム設定 -->
    <div class="soccer-team-setting">

        <div class="soccer-team-setting-row">

            <label for="soccerEditTeam">
                応援チーム
            </label>

            <input
                type="text"
                id="soccerEditTeam"
                readonly
            >

            <select id="soccerEditHomeAway">
                <option value="home">ホーム</option>
                <option value="away">アウェイ</option>
            </select>

        </div>


        <div class="soccer-team-setting-row">

            <label for="soccerEditOpponent">
                相手チーム
            </label>

            <input
                type="text"
                id="soccerEditOpponent"
                placeholder="相手チーム名を入力"
            >

        </div>

    </div>


    <!-- 試合表示 -->
    <div class="soccer-match-board">

        <div class="soccer-match-header">

            <div class="soccer-match-column">

                <div class="soccer-match-side">
                    ホーム
                </div>

                <div
                    class="soccer-match-team-name"
                    data-soccer-team-name>
                </div>

            </div>


            <div class="soccer-match-separator">
                －
            </div>


            <div class="soccer-match-column">

                <div class="soccer-match-side">
                    アウェイ
                </div>

                <div
                    class="soccer-match-team-name"
                    data-soccer-opponent-name>
                </div>

            </div>

        </div>


        <!-- 現在の得点 -->
        <div class="soccer-live-score-row">

            <div
                id="soccerEditTeamTotal"
                class="soccer-live-score">
                0
            </div>

            <div class="soccer-score-dash">
                －
            </div>

            <div
                id="soccerEditOpponentTotal"
                class="soccer-live-score">
                0
            </div>

        </div>

    </div>


    <!-- 前半・後半 -->
    <div class="soccer-score-section">

        <div class="soccer-score-row">

            <label>
                前半
            </label>

            <input
                type="number"
                id="soccerEditFirstHalfTeam"
                min="0"
                inputmode="numeric"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditFirstHalfOpponent"
                min="0"
                inputmode="numeric"
            >

        </div>


        <div class="soccer-score-row">

            <label>
                後半
            </label>

            <input
                type="number"
                id="soccerEditSecondHalfTeam"
                min="0"
                inputmode="numeric"
            >

            <span>－</span>

            <input
                type="number"
                id="soccerEditSecondHalfOpponent"
                min="0"
                inputmode="numeric"
            >

        </div>

    </div>


    <!-- 延長 -->
    <div class="soccer-extra-section">

        <label class="soccer-checkbox-row">

            <input
                type="checkbox"
                id="soccerEditExtraTime"
            >

            <span>延長</span>

        </label>


        <div
            id="soccerEditExtraTimeArea"
            class="soccer-extra-time-area"
        >

            <div class="soccer-score-row">

                <label>
                    前半
                </label>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraFirstHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>


            <div class="soccer-score-row">

                <label>
                    後半
                </label>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditExtraSecondHalfOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>


    <!-- PK -->
    <div class="soccer-penalty-section">

        <label class="soccer-checkbox-row">

            <input
                type="checkbox"
                id="soccerEditPenaltyShootout"
            >

            <span>PK</span>

        </label>


        <div
            id="soccerEditPenaltyArea"
            class="soccer-penalty-area"
        >

            <div class="soccer-score-row">

                <input
                    type="number"
                    id="soccerEditPenaltyTeam"
                    min="0"
                    inputmode="numeric"
                >

                <span>－</span>

                <input
                    type="number"
                    id="soccerEditPenaltyOpponent"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>

    </div>


    <!-- =====================
         結果
    ====================== --><div class="soccer-info-section">

    <label for="soccerEditResult">試合結果</label>

    <select id="soccerEditResult">

        <option value="win">勝ち</option>
        <option value="draw">引き分け</option>
        <option value="loss">負け</option>
        <option value="pending">未確定</option>

    </select>

</div>


    <!-- 場所 -->
    <div class="soccer-info-section">

        <label for="soccerEditLocation">
            場所
        </label>

        <input
            type="text"
            id="soccerEditLocation"
            placeholder="試合会場"
        >

    </div>


    <!-- メモ -->
    <div class="soccer-info-section">

        <label for="soccerEditMemo">
            メモ
        </label>

        <textarea
            id="soccerEditMemo"
            rows="4"
            placeholder="メモ"
        ></textarea>

    </div>


    <!-- ボタン -->
    <div class="soccer-edit-buttons">

<button
    type="button"
    onclick="closeSportsGameEditPage()"
>
    キャンセル
</button>

        <button
            type="button"
            onclick="saveSoccerGameFromEditPage()"
        >
            保存
        </button>

    </div>

</form>
