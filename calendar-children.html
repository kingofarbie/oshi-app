<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>こどもカレンダー</title>

<link
    rel="stylesheet"
    href="./calendar-children.css"
>

</head>


<body>


<div
    id="childrenCalendarApp"
    class="children-calendar-app"
>


<!-- =========================================
     ヘッダー
========================================== -->

<header class="children-calendar-header">

    <h1 class="children-calendar-title">
        👶 こどもカレンダー
    </h1>


    <select
        id="childrenSelector"
        class="children-selector"
    >

        <option value="">
            子どもを選択
        </option>

        <option value="settings">
            ⚙️ 子どもの設定
        </option>

    </select>


    <button
        type="button"
        class="children-calendar-back-button"
        onclick="closeChildrenCalendar()"
    >
        ◀ カレンダー
    </button>

</header>



<!-- =========================================
     子どもプロフィール ＋ 成長・定期記録
========================================== -->

<div class="children-profile-row">


    <section
        id="childrenProfile"
        class="children-profile"
    >

        <div class="children-profile-empty">

            まず「子どもの設定」から<br>
            子どもを追加してください。

        </div>

    </section>



    <button
        type="button"
        id="childrenGrowthEntryButton"
        class="children-growth-entry"
    >

        <span class="children-growth-entry-icon">
            📈
        </span>

        <span class="children-growth-entry-text">

            <span class="children-growth-entry-title">
                成長・定期記録
            </span>

            <span class="children-growth-entry-description">
                身長・予防接種など
            </span>

        </span>

        <span class="children-growth-entry-arrow">
            ›
        </span>

    </button>


</div>



<!-- =========================================
     カレンダー
========================================== -->

<section
    id="childrenCalendarSection"
    class="children-calendar-section"
    style="display:none;"
>


    <div class="children-month-navigation">


        <button
            type="button"
            id="childrenPreviousMonthButton"
            class="children-month-button"
        >
            ◀
        </button>


<button
    type="button"
    id="childrenMonthTitleButton"
    class="children-month-title-button"
    onclick="openChildrenCalendarDatePicker()">
</button>


<button
    type="button"
    class="children-today-button"
    onclick="goChildrenCalendarToday()"
>
    今日
</button>

        <button
            type="button"
            id="childrenNextMonthButton"
            class="children-month-button"
        >
            ▶
        </button>


    </div>


    <div
        id="childrenCalendar"
        class="children-calendar"
    ></div>


</section>



<!-- =========================================
     選択日の1日の記録
========================================== -->

<section
    id="childrenDailySection"
    class="children-daily-section"
    style="display:none;"
>


    <div class="children-daily-header">

        <h2 id="childrenDailyTitle">
            👶 今日の記録
        </h2>

    </div>



    <div class="children-daily-basic-section">


        <div class="children-daily-basic-header">


            <div class="children-daily-section-title">
                📝 1日の記録
            </div>


            <button
                type="button"
                id="childrenDailyAddButton"
                class="children-daily-add-button"
            >
                ＋項目追加
            </button>


        </div>


    </div>



    <div class="children-daily-records-section">


        <div class="children-daily-section-title">
            📋 この日の記録
        </div>


        <div
            id="childrenDailyRecords"
            class="children-daily-records"
        ></div>


    </div>


</section>



<!-- =========================================
     成長・定期記録画面
========================================== -->

<section
    id="childrenGrowthSection"
    class="children-growth-section"
    style="display:none;"
>


    <div class="children-growth-section-header">


        <button
            type="button"
            id="childrenGrowthBackButton"
            class="children-growth-back-button"
        >
            ◀ こどもカレンダー
        </button>


        <div class="children-growth-section-title">
            📈 成長・定期記録
        </div>


    </div>



    <div class="children-growth-category-list">


        <button
            type="button"
            class="children-growth-category"
            data-growth-category="heightWeight"
        >

            <span class="children-growth-category-icon">
                ⚖️
            </span>

            <span class="children-growth-category-text">

                <span class="children-growth-category-name">
                    身長・体重
                </span>

                <span class="children-growth-category-description">
                    身長や体重の変化を記録
                </span>

            </span>

            <span class="children-growth-category-arrow">
                ›
            </span>

        </button>



        <button
            type="button"
            class="children-growth-category"
            data-growth-category="teeth"
        >

            <span class="children-growth-category-icon">
                🦷
            </span>

            <span class="children-growth-category-text">

                <span class="children-growth-category-name">
                    歯の記録
                </span>

                <span class="children-growth-category-description">
                    歯が生えた日などを記録
                </span>

            </span>

            <span class="children-growth-category-arrow">
                ›
            </span>

        </button>



        <button
            type="button"
            class="children-growth-category"
            data-growth-category="vaccination"
        >

            <span class="children-growth-category-icon">
                💉
            </span>

            <span class="children-growth-category-text">

                <span class="children-growth-category-name">
                    予防接種
                </span>

                <span class="children-growth-category-description">
                    ワクチンや接種回数を記録
                </span>

            </span>

            <span class="children-growth-category-arrow">
                ›
            </span>

        </button>



        <button
            type="button"
            class="children-growth-category"
            data-growth-category="medical"
        >

            <span class="children-growth-category-icon">
                🏥
            </span>

            <span class="children-growth-category-text">

                <span class="children-growth-category-name">
                    健診・病院
                </span>

                <span class="children-growth-category-description">
                    健診や病院での記録
                </span>

            </span>

            <span class="children-growth-category-arrow">
                ›
            </span>

        </button>



        <button
            type="button"
            class="children-growth-category"
            data-growth-category="milestone"
        >

            <span class="children-growth-category-icon">
                🌱
            </span>

            <span class="children-growth-category-text">

                <span class="children-growth-category-name">
                    成長・できたこと
                </span>

                <span class="children-growth-category-description">
                    新しくできるようになったことを記録
                </span>

            </span>

            <span class="children-growth-category-arrow">
                ›
            </span>

        </button>


    </div>


</section>



<!-- =========================================
     項目追加モーダル
========================================== -->

<div
    id="childrenRecordTypeModal"
    class="children-modal"
    style="display:none;"
>

    <div class="children-modal-overlay"></div>

    <div
        class="children-modal-content children-record-type-modal-content"
    >

        <div class="children-modal-header">

            <h2>
                📝 項目を追加
            </h2>

            <button
                type="button"
                id="childrenRecordTypeCloseButton"
                class="children-modal-close-button"
            >
                ×
            </button>

        </div>

        <div
            id="childrenRecordTypeList"
            class="children-record-type-list"
        ></div>

    </div>

</div>



<!-- =========================================
     子どもの設定モーダル
========================================== -->

<div
    id="childrenSettingsModal"
    class="children-modal"
    style="display:none;"
>

    <div class="children-modal-overlay"></div>

    <div class="children-modal-content">

        <div class="children-modal-header">

            <h2>
                ⚙️ 子どもの設定
            </h2>

            <button
                type="button"
                id="childrenSettingsCloseButton"
                class="children-modal-close-button"
            >
                ×
            </button>

        </div>

        <div
            id="childrenList"
            class="children-list"
        ></div>

        <button
            type="button"
            id="childrenAddButton"
            class="children-add-button"
        >
            ＋ 子どもを追加
        </button>

    </div>

</div>



<!-- =========================================
     子ども追加・編集モーダル
========================================== -->

<div
    id="childrenEditModal"
    class="children-modal"
    style="display:none;"
>

    <div class="children-modal-overlay"></div>

    <div
        class="children-modal-content children-edit-modal-content"
    >

        <div class="children-modal-header">

            <h2 id="childrenEditTitle">
                👶 子どもを追加
            </h2>

            <button
                type="button"
                id="childrenEditCloseButton"
                class="children-modal-close-button"
            >
                ×
            </button>

        </div>


        <form id="childrenEditForm">


            <div class="children-form-field">

                <label for="childrenNameInput">
                    名前
                </label>

                <input
                    type="text"
                    id="childrenNameInput"
                    autocomplete="off"
                    maxlength="50"
                    placeholder="例：はるちゃん"
                >

            </div>



            <!-- =================================
                 性別
            ================================== -->

            <div class="children-form-field">

                <label for="childrenGenderInput">
                    性別
                </label>

                <select
                    id="childrenGenderInput"
                    class="children-gender-input"
                >

                    <option value="">
                        選択してください
                    </option>

                    <option value="boy">
                        👦 男の子
                    </option>

                    <option value="girl">
                        👧 女の子
                    </option>

                </select>

            </div>



            <div class="children-form-field">

                <label for="childrenBirthdayInput">
                    誕生日
                </label>

                <input
                    type="date"
                    id="childrenBirthdayInput"
                >

            </div>



            <div class="children-form-actions">

                <button
                    type="button"
                    id="childrenEditCancelButton"
                    class="children-cancel-button"
                >
                    キャンセル
                </button>

                <button
                    type="submit"
                    class="children-save-button"
                >
                    保存
                </button>

            </div>


        </form>

    </div>

</div>


</div>


<!-- =====================
     👶 こどもカレンダー年月選択
===================== -->

<div
    id="childrenCalendarDatePickerModal"
    class="modal"
    style="display:none;"
>

    <div class="modal-content">

        <h2>
            📅 年月を選択
        </h2>

        <div class="calendar-date-picker">

            <label>
                年
            </label>

            <select id="childrenCalendarYearSelect">
            </select>

            <label>
                月
            </label>

            <select id="childrenCalendarMonthSelect">

                <option value="0">1月</option>
                <option value="1">2月</option>
                <option value="2">3月</option>
                <option value="3">4月</option>
                <option value="4">5月</option>
                <option value="5">6月</option>
                <option value="6">7月</option>
                <option value="7">8月</option>
                <option value="8">9月</option>
                <option value="9">10月</option>
                <option value="10">11月</option>
                <option value="11">12月</option>

            </select>

        </div>

        <button
            type="button"
            onclick="applyChildrenCalendarDatePicker()"
        >
            📅 この月へ移動
        </button>

        <button
            type="button"
            onclick="closeChildrenCalendarDatePicker()"
        >
            ❌ キャンセル
        </button>

    </div>

</div>

</body>

</html>
