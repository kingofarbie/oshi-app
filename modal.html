<!-- =====================================================
     🔢 数値入力モーダル
===================================================== -->

<div
    id="numberInputModal"
    class="number-input-modal"
    style="display:none;"
>

    <div class="number-input-dialog">

        <!-- タイトル -->
        <div
            id="numberInputTitle"
            class="number-input-title"
        >
            数値を入力
        </div>


        <!-- 入力値表示 -->
        <div
            id="numberInputDisplay"
            class="number-input-display"
        ></div>


        <!-- 数字キー -->
        <div class="number-keypad">

            <button
                type="button"
                data-number="1"
            >1</button>

            <button
                type="button"
                data-number="2"
            >2</button>

            <button
                type="button"
                data-number="3"
            >3</button>


            <button
                type="button"
                data-number="4"
            >4</button>

            <button
                type="button"
                data-number="5"
            >5</button>

            <button
                type="button"
                data-number="6"
            >6</button>


            <button
                type="button"
                data-number="7"
            >7</button>

            <button
                type="button"
                data-number="8"
            >8</button>

            <button
                type="button"
                data-number="9"
            >9</button>


            <button
                type="button"
                class="decimal-button"
                data-number="."
            >.</button>

            <button
                type="button"
                data-number="0"
            >0</button>

            <button
                type="button"
                class="backspace-button"
                data-action="backspace"
            >←</button>

        </div>


        <!-- 下部操作 -->
        <div class="number-input-actions">

            <button
                type="button"
                class="number-delete-button"
                data-action="delete"
            >
                キャンセル
            </button>

            <button
                type="button"
                class="number-reset-button"
                data-action="reset"
            >
                リセット
            </button>

            <button
                type="button"
                class="number-save-button"
                data-action="save"
            >
                保存
            </button>

        </div>

    </div>

</div>












<!-- =====================================================
     ✅ 共通確認モーダル
===================================================== -->

<div
    id="commonConfirmModal"
    class="common-confirm-modal"
    style="display:none;"
>

    <div class="common-confirm-dialog">

        <!-- メッセージ -->
        <div
            id="commonConfirmMessage"
            class="common-confirm-message"
        ></div>


        <!-- ボタン -->
        <div class="common-confirm-actions">

            <button
                type="button"
                id="commonConfirmCancelButton"
                class="common-confirm-cancel"
            >
                キャンセル
            </button>

            <button
                type="button"
                id="commonConfirmOkButton"
                class="common-confirm-ok"
            >
                確認
            </button>

        </div>

    </div>

</div>





<!-- ==============================
     🔁 繰り返し予定の削除
     専用モーダル
============================== -->
<div
    id="recurringDeleteModal"
    class="recurring-delete-modal"
    style="display:none;"
>
    <div
        class="recurring-delete-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="recurringDeleteTitle"
    >
        <h3 id="recurringDeleteTitle">
            🔁 繰り返し予定の削除
        </h3>

        <div
            id="recurringDeleteMessage"
            class="recurring-delete-message"
        ></div>

        <div class="recurring-delete-actions">
            <button
                type="button"
                id="recurringDeleteOneButton"
            >
                この日だけ削除
            </button>

            <button
                type="button"
                id="recurringDeleteAllButton"
            >
                繰り返し予定をすべて削除
            </button>

            <button
                type="button"
                id="recurringDeleteCancelButton"
            >
                キャンセル
            </button>
        </div>
    </div>
</div>





<!-- =====================================================
     📝 自由メモ・手書きメモ 共通編集モーダル
===================================================== -->

<div
    id="plannerNoteEditorModal"
    class="modal"
    style="display:none;"
>
    <div
        class="modal-content planner-note-editor"
        role="dialog"
        aria-modal="true"
        aria-labelledby="plannerNoteEditorTitle"
    >

        <h2 id="plannerNoteEditorTitle">
            📝 自由メモ
        </h2>

        <!-- 文字メモ設定 -->
        <div id="plannerNoteTextSettings">

            <label for="plannerNoteText">
                メモ内容
            </label>

            <textarea
                id="plannerNoteText"
                rows="4"
                placeholder="ここにメモを追加"
            ></textarea>

            <label for="plannerNoteFont">
                フォント
            </label>

            <select id="plannerNoteFont">
                <option value="sans-serif">ゴシック体</option>
                <option value="serif">明朝体</option>
                <option value="system-ui">システム標準</option>
            </select>

            <label for="plannerNoteFontSize">
                文字サイズ
            </label>

            <select id="plannerNoteFontSize">
                <option value="12">小</option>
                <option value="16" selected>標準</option>
                <option value="20">大</option>
                <option value="24">特大</option>
            </select>

            <label for="plannerNoteColor">
                文字色
            </label>

            <select id="plannerNoteColor">
                <option value="#333333">黒</option>
                <option value="#e91e63">ピンク</option>
                <option value="#2196f3">青</option>
                <option value="#4caf50">緑</option>
                <option value="#9c27b0">紫</option>
                <option value="#ff9800">オレンジ</option>
            </select>

        </div>

        <!-- 手書きメモ用の説明 -->
        <div
            id="plannerNoteDrawingSettings"
            style="display:none;"
        >
            手書きメモの編集画面は次の段階で追加します。
        </div>

        <div class="planner-note-editor-actions">

            <button
                type="button"
                id="plannerNoteSaveButton"
            >
                💾 保存
            </button>

            <button
                type="button"
                id="plannerNoteCancelButton"
            >
                キャンセル
            </button>

        </div>

    </div>
</div>
