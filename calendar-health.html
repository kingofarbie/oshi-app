<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>健康カレンダー | 推し活手帳</title>

    <link
        rel="stylesheet"
        href="calendar-health.css"
    >

</head>


<body>

<div
    id="healthCalendarScreen"
    class="health-calendar-screen"
>


    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="health-calendar-header">

        <h1
            id="healthCalendarTitle"
            class="health-calendar-title"
        >
            💊 健康カレンダー
        </h1>


        <button
            type="button"
            class="health-back-button"
            onclick="loadCalendarHTML()"
        >
            ◀ 通常カレンダー
        </button>

    </header>



    <!-- =========================
         月・今日
    ========================== -->

    <section class="health-calendar-controls">

        <div
            id="healthCalendarMonthTitle"
            class="health-month-title-button"
            onclick="openHealthCalendarDatePicker()"
        >
        </div>


        <button
            type="button"
            class="health-today-button"
            onclick="healthCalendarToday()"
        >
            📅 今日
        </button>

    </section>



    <!-- =========================
         カレンダー本体
    ========================== -->

    <main
        id="healthCalendar"
        class="health-calendar"
    >
    </main>



    <!-- =========================
         年月選択
    ========================== -->

    <div
        id="healthCalendarDatePickerModal"
        class="health-modal"
        style="display:none;"
    >

        <div class="health-modal-content">


            <div class="health-modal-header">

                <div class="health-modal-title">
                    📅 年月を選択
                </div>


                <button
                    type="button"
                    onclick="closeHealthCalendarDatePicker()"
                >
                    ✕
                </button>

            </div>



            <div class="health-date-picker">

                <label
                    for="healthCalendarYearSelect"
                >
                    年
                </label>


                <select
                    id="healthCalendarYearSelect"
                >
                </select>


                <label
                    for="healthCalendarMonthSelect"
                >
                    月
                </label>


                <select
                    id="healthCalendarMonthSelect"
                >

                    <option value="0">1月</option>
                    <option value="1">2月</option>
                    <option value="2">3月</option>
                    <option value="3">4月</option>
                    <option value="4">5月</option>
                    <option value="5">6月</option>
                    <option value="6">7月</option>
                    <option value="7">8月</option>
                    <option value="8">9月</option>
                    <option value="9">10月</option>
                    <option value="10">11月</option>
                    <option value="11">12月</option>

                </select>

            </div>



            <div class="health-modal-buttons">

                <button
                    type="button"
                    onclick="applyHealthCalendarDatePicker()"
                >
                    📅 この月へ移動
                </button>


                <button
                    type="button"
                    onclick="closeHealthCalendarDatePicker()"
                >
                    ❌ キャンセル
                </button>

            </div>


        </div>

    </div>


</div>


<script src="calendar-health.js"></script>

</body>

</html>
