<!-- =====================================================
     💊 健康管理
     calendar-health.html

     ・健康カレンダー
     ・📖 日めくり
     ・📊 グラフ
     ・服薬記録
     ・健康データ
===================================================== -->


<div
    id="healthCalendarScreen"
    class="health-calendar-screen"
>


    <!-- =================================================
         📅 健康カレンダー
    ================================================= -->

    <div
        id="healthCalendarPage"
        class="health-page"
    >

        <!-- ヘッダー -->

        <div class="health-calendar-header">

            <button
                type="button"
                class="health-back-button"
                onclick="loadCalendarHTML()"
            >
                ← カレンダー
            </button>


            <h1>
                💊 健康カレンダー
            </h1>


            <button
                type="button"
                class="health-graph-button"
                onclick="openHealthGraph()"
            >
                📊 グラフ
            </button>

        </div>


        <!-- =================================================
             年月
        ================================================= -->

        <div class="health-calendar-month-area">

            <button
                type="button"
                class="health-calendar-month-title"
                id="healthCalendarMonthTitle"
                onclick="openHealthCalendarDatePicker()"
            >
                2026年9月
            </button>


            <button
                type="button"
                class="health-calendar-today-button"
                onclick="healthCalendarToday()"
            >
                今日
            </button>

        </div>


        <!-- =================================================
             カレンダー
        ================================================= -->

        <div
            id="healthCalendar"
            class="health-calendar"
        ></div>

    </div>



    <!-- =====================================================
         📖 日めくり
    ===================================================== -->

    <div
        id="healthDailyPage"
        class="health-page health-daily-page"
        style="display:none;"
    >


        <!-- ヘッダー -->

        <div class="health-daily-header">

            <button
                type="button"
                class="health-back-button"
                onclick="closeHealthDailyView()"
            >
                ← カレンダー
            </button>


            <h1>
                📖 健康記録
            </h1>

        </div>


        <!-- =================================================
             日付移動
        ================================================= -->

        <div class="health-daily-date-area">

            <button
                type="button"
                class="health-daily-nav-button"
                onclick="healthDailyPreviousDay()"
                aria-label="前の日"
            >
                ‹
            </button>


            <div
                id="healthDailyDate"
                class="health-daily-date"
            >
            </div>


            <button
                type="button"
                class="health-daily-nav-button"
                onclick="healthDailyNextDay()"
                aria-label="次の日"
            >
                ›
            </button>

        </div>



        <!-- =================================================
             💊 服薬
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                💊 お薬
            </h2>


            <div class="health-medication-list">


                <!-- 朝 -->

                <div class="health-medication-row">

                    <div class="health-medication-label">
                        🌅 朝
                    </div>

                    <button
                        type="button"
                        class="health-medication-button"
                        data-medication="morning"
                        onclick="toggleHealthMedication('morning')"
                    >
                        服用した
                    </button>

                </div>


                <!-- 昼 -->

                <div class="health-medication-row">

                    <div class="health-medication-label">
                        ☀️ 昼
                    </div>

                    <button
                        type="button"
                        class="health-medication-button"
                        data-medication="noon"
                        onclick="toggleHealthMedication('noon')"
                    >
                        服用した
                    </button>

                </div>


                <!-- 夜 -->

                <div class="health-medication-row">

                    <div class="health-medication-label">
                        🌙 夜
                    </div>

                    <button
                        type="button"
                        class="health-medication-button"
                        data-medication="night"
                        onclick="toggleHealthMedication('night')"
                    >
                        服用した
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================================
             🌡️ 体温
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                🌡️ 体温
            </h2>


            <div class="health-input-row">

                <input
                    type="number"
                    id="healthTemperatureInput"
                    class="health-number-input"
                    inputmode="decimal"
                    step="0.1"
                    placeholder="36.5"
                >

                <span class="health-input-unit">
                    ℃
                </span>

            </div>

        </section>



        <!-- =================================================
             🩺 血圧
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                🩺 血圧
            </h2>


            <div class="health-blood-pressure-row">

                <div class="health-input-row">

                    <input
                        type="number"
                        id="healthSystolicInput"
                        class="health-number-input"
                        inputmode="numeric"
                        placeholder="120"
                    >

                    <span class="health-input-unit">
                        mmHg
                    </span>

                </div>


                <span class="health-blood-pressure-slash">
                    /
                </span>


                <div class="health-input-row">

                    <input
                        type="number"
                        id="healthDiastolicInput"
                        class="health-number-input"
                        inputmode="numeric"
                        placeholder="80"
                    >

                    <span class="health-input-unit">
                        mmHg
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             ❤️ 脈拍
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                ❤️ 脈拍
            </h2>


            <div class="health-input-row">

                <input
                    type="number"
                    id="healthPulseInput"
                    class="health-number-input"
                    inputmode="numeric"
                    placeholder="70"
                >

                <span class="health-input-unit">
                    bpm
                </span>

            </div>

        </section>



        <!-- =================================================
             🙂 体調
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                🙂 体調
            </h2>


            <select
                id="healthConditionInput"
                class="health-select-input"
            >

                <option value="">
                    選択してください
                </option>

                <option value="とても良い">
                    とても良い
                </option>

                <option value="良い">
                    良い
                </option>

                <option value="普通">
                    普通
                </option>

                <option value="少し悪い">
                    少し悪い
                </option>

                <option value="悪い">
                    悪い
                </option>

            </select>

        </section>



        <!-- =================================================
             🌸 生理
        ================================================= -->

        <section class="health-daily-section">

            <h2>
                🌸 生理
            </h2>


            <button
                type="button"
                id="healthMenstrualButton"
                class="health-menstrual-button"
                onclick="toggleHealthMenstrual()"
            >
                記録する
            </button>

        </section>



        <!-- =================================================
             ＋ その他
        ================================================= -->

        <section class="health-daily-section">

            <button
                type="button"
                id="healthOtherToggleButton"
                class="health-other-toggle-button"
                onclick="toggleHealthOtherFields()"
            >
                ＋ その他を記録
            </button>


            <div
                id="healthOtherFields"
                class="health-other-fields"
                style="display:none;"
            >


                <!-- 睡眠 -->

                <div class="health-other-item">

                    <label for="healthSleepInput">
                        😴 睡眠
                    </label>

                    <div class="health-input-row">

                        <input
                            type="number"
                            id="healthSleepInput"
                            class="health-number-input"
                            inputmode="decimal"
                            step="0.1"
                            placeholder="7.0"
                        >

                        <span class="health-input-unit">
                            時間
                        </span>

                    </div>

                </div>


                <!-- 水分 -->

                <div class="health-other-item">

                    <label for="healthWaterInput">
                        💧 水分
                    </label>

                    <div class="health-input-row">

                        <input
                            type="number"
                            id="healthWaterInput"
                            class="health-number-input"
                            inputmode="numeric"
                            placeholder="1500"
                        >

                        <span class="health-input-unit">
                            ml
                        </span>

                    </div>

                </div>


                <!-- 体重 -->

                <div class="health-other-item">

                    <label for="healthWeightInput">
                        ⚖️ 体重
                    </label>

                    <div class="health-input-row">

                        <input
                            type="number"
                            id="healthWeightInput"
                            class="health-number-input"
                            inputmode="decimal"
                            step="0.1"
                            placeholder="60.0"
                        >

                        <span class="health-input-unit">
                            kg
                        </span>

                    </div>

                </div>


                <!-- メモ -->

                <div class="health-other-item">

                    <label for="healthMemoInput">
                        📝 メモ
                    </label>

                    <textarea
                        id="healthMemoInput"
                        class="health-memo-input"
                        rows="4"
                        placeholder="気になったことなど"
                    ></textarea>

                </div>

            </div>

        </section>



        <!-- =================================================
             保存
        ================================================= -->

        <button
            type="button"
            class="health-save-button"
            onclick="saveHealthDailyRecord()"
        >
            💾 健康記録を保存
        </button>

    </div>



    <!-- =====================================================
         📊 グラフ
    ===================================================== -->

    <div
        id="healthGraphPage"
        class="health-page health-graph-page"
        style="display:none;"
    >


        <!-- ヘッダー -->

        <div class="health-graph-header">

            <button
                type="button"
                class="health-back-button"
                onclick="closeHealthGraph()"
            >
                ← 健康カレンダー
            </button>


            <h1>
                📊 健康グラフ
            </h1>

        </div>



        <!-- =================================================
             期間
        ================================================= -->

        <div class="health-graph-control-section">

            <div class="health-graph-control-title">
                表示期間
            </div>


            <div class="health-graph-period-buttons">

                <button
                    type="button"
                    class="health-graph-period-button active"
                    data-period="7"
                    onclick="setHealthGraphPeriod(7)"
                >
                    1週間
                </button>


                <button
                    type="button"
                    class="health-graph-period-button"
                    data-period="30"
                    onclick="setHealthGraphPeriod(30)"
                >
                    1か月
                </button>


                <button
                    type="button"
                    class="health-graph-period-button"
                    data-period="90"
                    onclick="setHealthGraphPeriod(90)"
                >
                    3か月
                </button>

            </div>

        </div>



        <!-- =================================================
             項目
        ================================================= -->

        <div class="health-graph-control-section">

            <div class="health-graph-control-title">
                表示項目
            </div>


            <div class="health-graph-metric-buttons">

                <button
                    type="button"
                    class="health-graph-metric-button active"
                    data-metric="temperature"
                    onclick="setHealthGraphMetric('temperature')"
                >
                    🌡️ 体温
                </button>


                <button
                    type="button"
                    class="health-graph-metric-button"
                    data-metric="bloodPressure"
                    onclick="setHealthGraphMetric('bloodPressure')"
                >
                    🩺 血圧
                </button>


                <button
                    type="button"
                    class="health-graph-metric-button"
                    data-metric="pulse"
                    onclick="setHealthGraphMetric('pulse')"
                >
                    ❤️ 脈拍
                </button>


                <button
                    type="button"
                    class="health-graph-metric-button"
                    data-metric="weight"
                    onclick="setHealthGraphMetric('weight')"
                >
                    ⚖️ 体重
                </button>


                <button
                    type="button"
                    class="health-graph-metric-button"
                    data-metric="sleep"
                    onclick="setHealthGraphMetric('sleep')"
                >
                    😴 睡眠
                </button>


                <button
                    type="button"
                    class="health-graph-metric-button"
                    data-metric="water"
                    onclick="setHealthGraphMetric('water')"
                >
                    💧 水分
                </button>

            </div>

        </div>



        <!-- =================================================
             📈 グラフ
        ================================================= -->

        <section class="health-graph-chart-section">

            <div
                id="healthGraphTitle"
                class="health-graph-title"
            >
                🌡️ 体温
            </div>


            <div
                id="healthGraphChart"
                class="health-graph-chart"
            >
            </div>


            <div
                id="healthGraphNoData"
                class="health-graph-no-data"
                style="display:none;"
            >
                この期間の記録はありません
            </div>

        </section>


    </div>



    <!-- =====================================================
         📅 年月選択モーダル
    ===================================================== -->

    <div
        id="healthCalendarDatePickerModal"
        class="health-modal"
        style="display:none;"
    >

        <div class="health-modal-content">

            <div class="health-modal-header">

                <div class="health-modal-title">
                    📅 年月を選択
                </div>


                <button
                    type="button"
                    onclick="closeHealthCalendarDatePicker()"
                    aria-label="閉じる"
                >
                    ✕
                </button>

            </div>


            <div class="health-date-picker-selects">

                <select
                    id="healthCalendarYearSelect"
                ></select>


                <select
                    id="healthCalendarMonthSelect"
                >

                    <option value="0">
                        1月
                    </option>

                    <option value="1">
                        2月
                    </option>

                    <option value="2">
                        3月
                    </option>

                    <option value="3">
                        4月
                    </option>

                    <option value="4">
                        5月
                    </option>

                    <option value="5">
                        6月
                    </option>

                    <option value="6">
                        7月
                    </option>

                    <option value="7">
                        8月
                    </option>

                    <option value="8">
                        9月
                    </option>

                    <option value="9">
                        10月
                    </option>

                    <option value="10">
                        11月
                    </option>

                    <option value="11">
                        12月
                    </option>

                </select>

            </div>


            <div class="health-modal-buttons">

                <button
                    type="button"
                    onclick="closeHealthCalendarDatePicker()"
                >
                    キャンセル
                </button>


                <button
                    type="button"
                    onclick="applyHealthCalendarDatePicker()"
                >
                    適用
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================================
         💊 服薬削除確認モーダル
    ===================================================== -->

    <div
        id="healthMedicationDeleteModal"
        class="health-modal"
        style="display:none;"
    >

        <div class="health-modal-content health-medication-delete-modal">

            <div class="health-modal-header">

                <div class="health-modal-title">
                    💊 服薬記録
                </div>


                <button
                    type="button"
                    onclick="closeHealthMedicationDeleteModal()"
                    aria-label="閉じる"
                >
                    ✕
                </button>

            </div>


            <div
                id="healthMedicationDeleteMessage"
                class="health-medication-delete-message"
            ></div>


            <div class="health-modal-buttons">

                <button
                    type="button"
                    onclick="closeHealthMedicationDeleteModal()"
                >
                    キャンセル
                </button>


                <button
                    type="button"
                    onclick="confirmDeleteHealthMedication()"
                >
                    削除する
                </button>

            </div>

        </div>

    </div>


</div>
