<!-- =========================
     推しリスト
========================= -->

<!-- ページヘッダー -->
<div class="page-header">

    <h2 class="page-title">
        ⭐ 推しリスト
    </h2>

    <button
        type="button"
        class="add-btn"
        onclick="openOshiRegisterModal()">
        ＋ 推しを登録
    </button>

</div>


<!-- =====================
     絞り込み・並べ替え
===================== -->

<div class="oshi-filter-area">

    <select id="oshiGenreFilter">

        <option value="all">
            すべてのジャンル
        </option>

        <option value="artists">
            🎤 アーティスト
        </option>

        <option value="sports">
            ⚽ スポーツ
        </option>

        <option value="other">
            その他
        </option>

    </select>


    <select id="oshiTypeFilter">

        <option value="all">
            個人・団体すべて
        </option>

        <option value="individual">
            👤 個人
        </option>

        <option value="group">
            👥 団体
        </option>

    </select>


    <select id="oshiSort">

        <option value="registered">
            登録順
        </option>

        <option
            value="reading"
            class="premium-option">
            🔤 ローマ字順
        </option>

    </select>

</div>


<!-- =====================
     推し付箋リスト
===================== -->

<div
    id="oshiList"
    class="oshi-list">

    <!-- JSで生成 -->

</div>



<!-- =========================
     推し登録モーダル
========================= -->

<div
    id="oshiRegisterModal"
    class="modal">

    <div class="modal-content oshi-register-modal">

        <h2>
            ⭐ 推しを登録
        </h2>


        <!-- =====================
             名前
        ====================== -->

        <div class="event-form-row">

            <label for="oshiRegisterName">
                名前・名称
            </label>

            <input
                type="text"
                id="oshiRegisterName"
                placeholder="例：Ado">

        </div>


        <!-- =====================
             ローマ字
        ====================== -->

<!-- =====================
     ローマ字
===================== -->

<div class="event-form-row">

    <label for="oshiRegisterReading">
        ローマ字
    </label>

    <input
        type="text"
        id="oshiRegisterReading"
        placeholder="例：ado / aimyon"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false">

    <small class="oshi-reading-help">
        並べ替え用・海外向け表記。
        自動候補を確認して自由に修正できます。
    </small>

    <div
        id="oshiReadingSuggestion"
        class="oshi-reading-suggestion"
        style="display:none;">

        <span class="oshi-reading-suggestion-label">
            💡 ローマ字候補
        </span>

        <button
            type="button"
            id="oshiReadingSuggestionButton"
            class="oshi-reading-suggestion-button">
        </button>

    </div>

</div>

        <!-- =====================
             ジャンル
        ====================== -->

        <div class="event-form-row">

            <label for="oshiRegisterGenre">
                ジャンル
            </label>

            <select id="oshiRegisterGenre">

                <option value="artists">
                    🎤 アーティスト
                </option>

                <option value="sports">
                    ⚽ スポーツ
                </option>

                <option value="other">
                    その他
                </option>

            </select>

        </div>


        <!-- =====================
             個人 / 団体
        ====================== -->

        <div class="event-form-row">

            <label for="oshiRegisterType">
                区分
            </label>

            <select id="oshiRegisterType">

                <option value="individual">
                    👤 個人
                </option>

                <option value="group">
                    👥 団体
                </option>

            </select>

        </div>


        <!-- =====================
             ボタン
        ====================== -->

        <div class="event-modal-buttons">

            <button
                type="button"
                class="save-btn"
                onclick="registerOshi()">

                💾 登録

            </button>


            <button
                type="button"
                onclick="closeOshiRegisterModal()">

                キャンセル

            </button>

        </div>

    </div>

</div>
