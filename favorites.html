<!-- =====================================================
     📷 お気に入り写真
====================================================== -->

<section class="favorites-section">

    <div class="favorites-section-header">

        <div>
            <h3>📷 お気に入り写真</h3>

            <p>
                お気に入りの写真
            </p>
        </div>


        <div class="memory-header-actions">

            <!-- 写真追加 -->

            <button
                type="button"
                onclick="favoritePhotoOpenPicker()"
                title="写真を追加">

                ＋

            </button>


            <!-- 写真削除 -->

            <button
                type="button"
                onclick="favoritePhotoStartDeleteMode()"
                title="写真を削除">

                🗑

            </button>


            <!-- 写真共有 -->

            <button
                type="button"
                onclick="favoritePhotoStartShareMode()"
                title="写真を共有">

                📤

            </button>


            <!-- 写真並べ替え -->

            <button
                type="button"
                onclick="favoritePhotoStartSortMode()"
                title="写真を並べ替え">

                🔀

            </button>

        </div>

    </div>


    <!-- =================================================
         写真操作バー
    ================================================== -->

    <div
        id="favorite-photo-action-bar"
        class="favorite-photo-action-bar"
        style="display:none;">
    </div>


    <!-- =================================================
         写真一覧
    ================================================== -->

    <div
        id="favorite-photo-list"
        class="favorites-photo-list">

        <div class="favorites-empty">

            📷
            <br>

            お気に入り写真はありません

        </div>

    </div>

</section>


<!-- =====================================================
     📷 お気に入り直接追加用
====================================================== -->

<input
    type="file"
    id="favoritePhotoPicker"
    accept="image/*"
    multiple
    style="display:none;"
    onchange="favoritePhotoHandleSelected(event)"
>


<!-- =====================================================
     🗑 写真削除確認
====================================================== -->

<div
    id="favoritePhotoDeleteModal"
    class="modal"
    style="display:none;">

    <div class="modal-content">

        <h2>
            🗑 写真を削除
        </h2>

        <div
            id="favoritePhotoDeleteMessage"
            class="favorite-delete-confirm-text">
        </div>

        <div class="favorites-modal-buttons">

            <button
                type="button"
                onclick="favoritePhotoConfirmDelete()">

                🗑 削除

            </button>

            <button
                type="button"
                onclick="favoritePhotoCancelDelete()">

                キャンセル

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     📤 写真共有確認
====================================================== -->

<div
    id="favoritePhotoShareModal"
    class="modal"
    style="display:none;">

    <div class="modal-content">

        <h2>
            📤 写真を共有
        </h2>

        <div
            id="favoritePhotoShareList"
            class="favorite-share-list">
        </div>

        <div class="favorites-modal-buttons">

            <button
                type="button"
                onclick="favoritePhotoConfirmShare()">

                📤 共有

            </button>

            <button
                type="button"
                onclick="favoritePhotoCancelShare()">

                キャンセル

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     🔀 写真並べ替え
====================================================== -->

<div
    id="favoritePhotoSortModal"
    class="modal"
    style="display:none;">

    <div class="modal-content">

        <h2>
            🔀 写真並べ替え
        </h2>

        <button
            type="button"
            onclick="favoritePhotoSetSort('new')">

            🆕 新しい順

        </button>

        <button
            type="button"
            onclick="favoritePhotoSetSort('old')">

            📜 古い順

        </button>

        <button
            type="button"
            onclick="favoritePhotoSetSort('free')">

            ✋ 自由に並べ替え

        </button>

        <button
            type="button"
            onclick="favoritePhotoCloseSortModal()">

            ❌ 閉じる

        </button>

    </div>

</div>
