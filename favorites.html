<!-- =====================================================
     📷 お気に入り写真
====================================================== -->

<section class="favorites-section">

    <div class="favorites-section-header">

        <div>
            <h3>📷 お気に入り写真</h3>

            <p>
                お気に入りの写真
            </p>
        </div>


        <div class="memory-header-actions">

            <!-- 写真追加 -->
            <button
                type="button"
                onclick="favoritePhotoOpenPicker()"
                title="写真を追加">
                ＋
            </button>


            <!-- 写真削除 -->
            <button
                type="button"
                onclick="favoritePhotoDeleteMode()"
                title="写真を削除">
                🗑
            </button>


            <!-- 写真共有 -->
            <button
                type="button"
                onclick="favoritePhotoShareMode()"
                title="写真を共有">
                📤
            </button>


            <!-- 写真並べ替え -->
            <button
                type="button"
                onclick="favoritePhotoSortMode()"
                title="写真を並べ替え">
                🔀
            </button>

        </div>

    </div>


    <!-- =================================================
         写真操作バー
         ※ favorites-photo.js が必要に応じて生成
    ================================================== -->

    <div
        id="favorite-photo-action-bar"
        class="favorite-photo-action-bar"
        style="display:none;">
    </div>


    <!-- =================================================
         写真一覧
    ================================================== -->

    <div
        id="favorite-photo-list"
        class="favorites-photo-list">

        <div class="favorites-empty">
            📷
            <br>
            お気に入り写真はありません
        </div>

    </div>

</section>


<!-- =====================================================
     📷 お気に入り直接追加用
====================================================== -->

<input
    type="file"
    id="favoritePhotoPicker"
    accept="image/*"
    multiple
    style="display:none;"
    onchange="favoritePhotoSelected(event)"
>


<!-- =====================================================
     📷 お気に入り写真ビューア
====================================================== -->

<div
    id="favoritePhotoViewer"
    class="favorite-photo-viewer"
    style="display:none;"
>

    <!-- 閉じる -->
    <button
        type="button"
        class="favorite-photo-viewer-close"
        onclick="favoritePhotoCloseViewer()">
        ✕
    </button>


    <!-- 共有 -->
    <button
        type="button"
        class="favorite-photo-viewer-share"
        onclick="favoritePhotoShareCurrent()">
        📤
    </button>


    <!-- 削除 -->
    <button
        type="button"
        class="favorite-photo-viewer-delete"
        onclick="favoritePhotoDeleteCurrent()">
        🗑
    </button>


    <!-- 前へ -->
    <button
        type="button"
        class="favorite-photo-viewer-prev"
        onclick="favoritePhotoPrevious()">
        ‹
    </button>


    <!-- 写真 -->
    <div
        class="favorite-photo-viewer-image-wrap"
        ontouchstart="favoritePhotoDragStart(event)"
        ontouchmove="favoritePhotoPinch(event)"
        ontouchend="favoritePhotoDragEnd(); favoritePhotoSwipe(event)"
        onclick="favoritePhotoDoubleTap(event)"
    >

        <img
            id="favoritePhotoViewerImage"
            class="favorite-photo-viewer-image"
            src=""
            alt="お気に入り写真"
            draggable="false"
        >

    </div>


    <!-- 次へ -->
    <button
        type="button"
        class="favorite-photo-viewer-next"
        onclick="favoritePhotoNext()">
        ›
    </button>

</div>
