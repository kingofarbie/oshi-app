<!-- =====================================================
     📷 お気に入り写真
====================================================== -->

<section class="favorites-section">

    <!-- ===============================
         ヘッダー
    ================================ -->

    <div class="favorites-section-header">

        <div>
            <h3>📷 お気に入り写真</h3>

            <p>
                お気に入りの写真
            </p>
        </div>


        <!-- ===============================
             写真操作ボタン
        ================================ -->

        <div class="memory-header-actions">

            <!-- 写真追加 -->
            <button
                type="button"
                onclick="favoritePhotoOpenPicker()"
                title="写真を追加">
                ＋
            </button>


            <!-- 写真削除 -->
            <button
                type="button"
                onclick="favoritesPhotoDeleteMode()"
                title="写真を削除">
                🗑
            </button>


            <!-- 写真共有 -->
            <button
                type="button"
                onclick="favoritesPhotoShareMode()"
                title="写真を共有">
                📤
            </button>


            <!-- 写真並べ替え -->
            <button
                type="button"
                onclick="favoritesPhotoSortMode()"
                title="写真を並べ替え">
                🔀
            </button>

        </div>

    </div>


    <!-- =================================================
         写真一覧

         favorites.js の
         favoritesRenderPhotos()
         がここを書き換える
    ================================================== -->

    <div
        id="favorite-photo-list"
        class="favorites-photo-list">

        <div class="favorites-empty">
            📷
            <br>
            お気に入り写真はありません
        </div>

    </div>

</section>



<!-- =====================================================
     📷 お気に入り直接追加用
====================================================== -->

<input
    type="file"
    id="favorites-photo-picker"
    accept="image/*"
    multiple
    style="display:none;"
    onchange="favoritePhotoSelected(event)"
>



<!-- =====================================================
     📷 お気に入り専用写真ビューア
====================================================== -->

<div
    id="favorites-photo-viewer"
    class="favorite-photo-viewer"
    style="display:none;"
>


    <!-- =================================================
         右上ボタン
         
         JS:
         favoritesInstallViewerButtons()
         と完全一致
    ================================================== -->


    <!-- 共有 -->
    <button
        type="button"
        id="favorites-viewer-share"
        class="favorite-photo-viewer-share"
        title="共有">
        📤
    </button>


    <!-- 削除 -->
    <button
        type="button"
        id="favorites-viewer-delete"
        class="favorite-photo-viewer-delete"
        title="削除">
        🗑
    </button>


    <!-- 閉じる -->
    <button
        type="button"
        id="favorites-viewer-close"
        class="favorite-photo-viewer-close"
        title="閉じる">
        ✕
    </button>



    <!-- =================================================
         前の写真
    ================================================== -->

    <button
        type="button"
        class="favorite-photo-viewer-prev"
        onclick="favoritesShowPhoto(
            favoritesViewerIndex - 1
        )"
        title="前の写真">
        ‹
    </button>



    <!-- =================================================
         写真表示エリア
    ================================================== -->

    <div
        class="favorite-photo-viewer-image-wrap"
    >

        <img
            id="favorites-photo-viewer-image"
            class="favorite-photo-viewer-image"
            src=""
            alt="お気に入り写真"
            draggable="false"
        >

    </div>



    <!-- =================================================
         次の写真
    ================================================== -->

    <button
        type="button"
        class="favorite-photo-viewer-next"
        onclick="favoritesShowPhoto(
            favoritesViewerIndex + 1
        )"
        title="次の写真">
        ›
    </button>

</div>
