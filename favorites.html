<!-- =====================================================
     📷 お気に入り写真
====================================================== -->

<section class="favorites-section">

    <div class="favorites-section-header">

        <div>
            <h3>📷 お気に入り写真</h3>

            <p>
                お気に入りの写真
            </p>
        </div>


        <div class="memory-header-actions">

<!-- 写真追加 -->
<button
    type="button"
    onclick="favoritePhotoOpenPicker()"
    title="写真を追加">
    ＋
</button>

<!-- 写真削除 -->
<button
    type="button"
    onclick="favoritePhotoDeleteMode()"
    title="写真を削除">
    🗑
</button>

<!-- 写真共有 -->
<button
    type="button"
    onclick="favoritePhotoShareMode()"
    title="写真を共有">
    📤
</button>

<!-- 写真並べ替え -->
<button
    type="button"
    onclick="favoritePhotoSortMode()"
    title="写真を並べ替え">
    🔀
</button>
        </div>

    </div>


    <!-- =================================================
         写真操作バー
         ※ favorites-photo.js が必要に応じて生成
    ================================================== -->

    <div
        id="favorite-photo-action-bar"
        class="favorite-photo-action-bar"
        style="display:none;">
    </div>


    <!-- =================================================
         写真一覧
    ================================================== -->

    <div
        id="favorite-photo-list"
        class="favorites-photo-list">

        <div class="favorites-empty">
            📷
            <br>
            お気に入り写真はありません
        </div>

    </div>

</section>


<!-- =====================================================
     📷 お気に入り直接追加用
====================================================== -->

<input
    type="file"
    id="favoritePhotoPicker"
    accept="image/*"
    multiple
    style="display:none;"
    onchange="favoritePhotoSelected(event)"
>


<!-- =====================================================
     📷 お気に入り写真ビューア
====================================================== -->

<div
    id="favorites-photo-viewer"
    class="favorites-photo-viewer"
    style="display:none;"
>

    <!-- =================================================
         右上操作ボタン
    ================================================== -->

    <div class="favorites-photo-viewer-actions">

        <!-- 閉じる -->
        <button
            type="button"
            class="favorites-photo-viewer-close"
            id="favorites-viewer-close"
            title="閉じる">
            ✕
        </button>

        <!-- 共有 -->
        <button
            type="button"
            class="favorites-photo-viewer-share"
            id="favorites-viewer-share"
            title="共有">
            📤
        </button>

        <!-- 削除 -->
        <button
            type="button"
            class="favorites-photo-viewer-delete"
            id="favorites-viewer-delete"
            title="削除">
            🗑
        </button>

    </div>


    <!-- =================================================
         写真表示エリア
    ================================================== -->

    <div
        class="favorites-photo-viewer-image-wrap"
    >

        <!-- 前の写真 -->
        <button
            type="button"
            class="favorites-photo-viewer-prev"
            onclick="favoritesShowPhoto(favoritesViewerIndex - 1)"
            title="前の写真">
            ‹
        </button>


        <!-- 写真 -->
        <img
            id="favorites-photo-viewer-image"
            class="favorites-photo-viewer-image"
            src=""
            alt="お気に入り写真"
            draggable="false"
        >


        <!-- 次の写真 -->
        <button
            type="button"
            class="favorites-photo-viewer-next"
            onclick="favoritesShowPhoto(favoritesViewerIndex + 1)"
            title="次の写真">
            ›
        </button>

    </div>

</div>
