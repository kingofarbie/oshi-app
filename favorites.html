<!-- =========================================================
     ⭐ お気に入りページ
     完全独立版

     【重要】
     ・photo.jsのHTMLを使用しない
     ・1日手帳のフォトビューアを使用しない
     ・お気に入り専用フォトビューアを使用
     ・お気に入り専用ID / classを使用
     ・お気に入り専用関数のみ呼び出す
========================================================= -->

<div class="favorites-page">

    <!-- =====================================================
         ヘッダー
    ====================================================== -->

    <div class="favorites-header">

        <button
            type="button"
            onclick="switchTab('home', event)">
            ← ホーム
        </button>

        <div class="favorites-header-title">

            <h2>⭐ お気に入り</h2>

            <p>
                お気に入りの予定・写真を楽しむページ
            </p>

        </div>

    </div>


    <!-- =====================================================
         🏆 お気に入りイベント
    ====================================================== -->

    <section class="favorites-section">

        <div class="favorites-section-header">

            <div>

                <h3>🏆 ベストイベント</h3>

                <p>
                    お気に入りの予定
                </p>

            </div>


            <div class="memory-header-actions">

                <!-- 直接追加 -->

                <button
                    type="button"
                    onclick="favoriteOpenAddEvent()"
                    title="イベントを追加">

                    ＋

                </button>


                <!-- 削除 -->

                <button
                    type="button"
                    onclick="favoriteEventDeleteMode()"
                    title="イベントを削除">

                    🗑

                </button>


                <!-- 共有 -->

                <button
                    type="button"
                    onclick="favoriteEventShareMode()"
                    title="イベントを共有">

                    📤

                </button>


                <!-- 並べ替え -->

                <button
                    type="button"
                    onclick="favoriteEventSortMode()"
                    title="イベントを並べ替え">

                    🔀

                </button>

            </div>

        </div>


        <div
            id="favorite-event-action-bar"
            class="favorite-action-bar"
            style="display:none;">
        </div>


        <div
            id="favorite-event-list"
            class="favorites-event-list">

            <div class="favorites-empty">

                🏆
                <br>
                お気に入りイベントはありません

            </div>

        </div>

    </section>



    <!-- =====================================================
         📷 お気に入り写真
    ====================================================== -->

    <section class="favorites-section">

        <div class="favorites-section-header">

            <div>

                <h3>📷 お気に入り写真</h3>

                <p>
                    お気に入りの写真
                </p>

            </div>


            <div class="memory-header-actions">

                <!-- 直接追加 -->

                <button
                    type="button"
                    onclick="favoriteOpenPhotoPicker()"
                    title="写真を追加">

                    ＋

                </button>


                <!-- 削除 -->

                <button
                    type="button"
                    onclick="favoritePhotoDeleteMode()"
                    title="写真を削除">

                    🗑

                </button>


                <!-- 共有 -->

                <button
                    type="button"
                    onclick="favoritePhotoShareMode()"
                    title="写真を共有">

                    📤

                </button>


                <!-- 並べ替え -->

                <button
                    type="button"
                    onclick="favoritePhotoSortMode()"
                    title="写真を並べ替え">

                    🔀

                </button>

            </div>

        </div>


        <div
            id="favorite-photo-action-bar"
            class="favorite-action-bar"
            style="display:none;">
        </div>


        <div
            id="favorite-photo-list"
            class="favorites-photo-list">

            <div class="favorites-empty">

                📷
                <br>
                お気に入り写真はありません

            </div>

        </div>

    </section>

</div>



<!-- =========================================================
     📷 お気に入り直接追加
     写真選択
========================================================= -->

<input
    type="file"
    id="favoritePhotoPicker"
    accept="image/*"
    multiple
    style="display:none;"
    onchange="favoritePhotoSelected(event)">



<!-- =========================================================
     🏆 お気に入り直接追加
     イベント
========================================================= -->

<div
    id="favoriteAddEventModal"
    class="modal">

    <div class="modal-content">

        <h2>
            🏆 お気に入りイベントを追加
        </h2>

        <div
            id="favoriteAddEventContent">
        </div>

        <div class="favorites-modal-buttons">

            <button
                type="button"
                onclick="saveFavoriteDirectEvent()">

                保存

            </button>


            <button
                type="button"
                onclick="closeFavoriteAddEvent()">

                キャンセル

            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     📷 お気に入り専用フォトビューア
     
     ★ photo.jsのphotoViewerとは完全に別物
========================================================= -->

<div
    id="favoritePhotoViewer"
    class="favorite-photo-viewer"
    style="display:none;">

    <!-- 背景 -->

    <div
        class="favorite-photo-viewer-backdrop">
    </div>


    <!-- =====================================================
         上部操作
    ====================================================== -->

    <div
        class="favorite-photo-viewer-top">

        <!-- 閉じる -->

        <button
            type="button"
            id="favoritePhotoViewerClose"
            class="favorite-photo-close"
            aria-label="閉じる">

            ✕

        </button>

    </div>


    <!-- =====================================================
         写真表示領域
    ====================================================== -->

    <div
        id="favoritePhotoViewerStage"
        class="favorite-photo-viewer-stage">

        <img
            id="favoritePhotoViewerImage"
            class="favorite-photo-viewer-image"
            src=""
            alt="お気に入り写真"
            draggable="false">

    </div>


    <!-- =====================================================
         下部操作
    ====================================================== -->

    <div
        class="favorite-photo-viewer-controls">

        <!-- 削除 -->

        <button
            type="button"
            id="favoritePhotoViewerDelete"
            class="favorite-photo-delete"
            aria-label="削除">

            🗑

        </button>


        <!-- 共有 -->

        <button
            type="button"
            id="favoritePhotoViewerShare"
            class="favorite-photo-share"
            aria-label="共有">

            📤

        </button>

    </div>

</div>

<!-- =========================================================
     🔀 お気に入りイベント並べ替え
========================================================= -->

<div
    id="favoriteEventSortModal"
    class="modal">

    <div class="modal-content">

        <h2>
            🔀 イベント並べ替え
        </h2>

        <button
            type="button"
            onclick="favoriteSetEventSort('new')">

            🆕 新しい順

        </button>


        <button
            type="button"
            onclick="favoriteSetEventSort('old')">

            📜 古い順

        </button>


        <button
            type="button"
            onclick="favoriteSetEventSort('free')">

            ✋ 自由に並べ替え

        </button>


        <button
            type="button"
            onclick="favoriteCloseEventSortModal()">

            ❌ 閉じる

        </button>

    </div>

</div>
