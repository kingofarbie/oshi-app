<div class="favorite-photo-page-content">

    <div class="favorite-photo-header">

        <h2>⭐ お気に入り写真</h2>

        <div class="favorite-photo-actions">

            <button
                type="button"
                onclick="favoritePhotoOpenPicker()">
                ＋
            </button>

            <button
                type="button"
                onclick="favoritePhotoDeleteMode()">
                🗑
            </button>

            <button
                type="button"
                onclick="favoritePhotoShareMode()">
                📤
            </button>

            <button
                type="button"
                onclick="favoritePhotoSortMode()">
                🔀
            </button>

        </div>

    </div>

    <input
        type="file"
        id="favoritePhotoPicker"
        accept="image/*"
        multiple
        style="display:none"
        onchange="favoritePhotoSelected(event)">

    <div id="favorite-photo-list"></div>

</div>


<!-- =====================
     ⭐ お気に入り写真ビューア
===================== -->

<!-- =====================
     ⭐ お気に入り写真ビューア
===================== -->

<div
    id="favoritePhotoViewer"
    class="favorite-photo-viewer"
    style="display:none;"
    ontouchstart="favoritePhotoViewerTouchStart(event)"
    ontouchend="favoritePhotoSwipe(event)">


    <!-- ⭐ お気に入り解除 -->
    <button
        type="button"
        id="favoritePhotoViewerFavorite"
        class="favorite-photo-viewer-favorite"
        onclick="favoritePhotoToggleCurrentFavorite()"
        style="display:none;">
        ⭐
    </button>


    <!-- 📤 共有 -->
    <button
        type="button"
        id="favoritePhotoViewerShare"
        class="favorite-photo-viewer-share"
        onclick="favoritePhotoShareCurrent()">
        📤
    </button>


    <!-- 🗑 直接追加写真のみ -->
    <button
        type="button"
        id="favoritePhotoViewerDelete"
        class="favorite-photo-viewer-delete"
        onclick="favoritePhotoDeleteCurrent()"
        style="display:none;">
        🗑
    </button>


    <!-- ✕ 閉じる -->
    <button
        type="button"
        class="favorite-photo-viewer-close"
        onclick="favoritePhotoCloseViewer()">
        ✕
    </button>


    <!-- 写真 -->
    <img
        id="favoritePhotoViewerImage"
        class="favorite-photo-viewer-image"
        draggable="false"
        ontouchstart="favoritePhotoViewerDragStart(event)"
        ontouchmove="favoritePhotoPinch(event)"
        ontouchend="favoritePhotoDragEnd(event);favoritePhotoDoubleTap(event)">

</div>
