<!-- =====================
     ホームメニュー
===================== -->

<div id="homeMenuOverlay" onclick="closeHomeMenu()"></div>

<div id="homeMenu">

    <div class="home-menu-header">
        <span>メニュー</span>

        <button onclick="closeHomeMenu()">
            ✕
        </button>
    </div>

<div class="home-menu-list">

    <button onclick="openAppShare()">
        <span>📤</span>
        <span>共有</span>
    </button>

<button onclick="switchTab('settingsPage',event); closeHomeMenu();">
    <span>⚙️</span>
    <span>設定</span>
</button>

<button onclick="openAboutApp()">
        <span>ℹ️</span>
    <span>アプリについて</span>
</button>

</div>
</div>



<!-- =====================
     アプリ共有モーダル
===================== -->

<div
    id="appShareModal"
    class="modal"
    style="display:none;">

    <div class="modal-content">

        <h2>
            📤 アプリを共有
        </h2>

        <p>
            このWebアプリを友達に共有できます。
        </p>


        <!-- QRコード -->

        <div
            id="appShareQr"
            style="
                display:flex;
                justify-content:center;
                margin:20px 0;
            ">
        </div>


        <!-- URL -->

<div
    id="appShareUrl"
    style="
        word-break:break-all;
        font-size:13px;
        padding:10px;
        background:#f5f5f5;
        color:#333;
        border-radius:8px;
        margin-bottom:12px;
        text-align:center;
    ">
</div>

        <!-- 共有 -->

        <button onclick="shareAppUrl()">
            📤 共有する
        </button>


        <!-- コピー -->

        <button onclick="copyAppUrl()">
            📋 URLをコピー
        </button>


        <!-- 閉じる -->

        <button onclick="closeAppShare()">
            ❌ 閉じる
        </button>

    </div>

</div>


<!-- =====================
     設定
===================== -->


<div id="settingsPage" class="page">

<div id="settingsContainer"></div>

</div>




<!-- =====================
     アプリについて読み込み
===================== -->

<div id="aboutAppContainer"></div>
