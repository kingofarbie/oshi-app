<div id="calendarPage" class="page"><!-- =====================
     カレンダー
===================== -->

<div class="card">

    <h2>
        📅 カレンダー
    </h2>

    <div id="calendar"></div>

</div>

</div><!-- =====================
     日付長押しメニュー
===================== --><div id="dayMenuModal" class="modal"><div class="modal-content">

    <div id="dayMenuDate" class="modal-title">
        日付
    </div>

    <button onclick="addEventFromMenu()">
        ➕ 予定追加
    </button>

    <button onclick="editEventFromMenu()">
        ✏️ 予定編集
    </button>

    <button onclick="copyEventFromMenu()">
        📋 予定コピー
    </button>

    <button onclick="deleteEventFromMenu()">
        🗑 予定削除
    </button>

    <button onclick="closeDayMenu()">
        ❌ 閉じる
    </button>

</div>

</div><!-- =====================
     削除する予定を選択
===================== --><div id="deleteSelectModal" class="modal"><div class="modal-content">

    <h3>
        削除する予定を選択
    </h3>

    <div id="deleteEventList"></div>

    <button onclick="deleteSelectedEvents()">
        🗑 削除
    </button>

    <button onclick="closeDeleteSelectModal()">
        ❌ キャンセル
    </button>

</div>

</div><!-- =====================
     編集する予定を選択
===================== --><div id="eventSelectModal" class="modal"><div class="modal-content">

    <h3>
        予定を選択
    </h3>

    <div id="eventSelectList"></div>

    <button onclick="closeEventSelectModal()">
        ❌ 閉じる
    </button>

</div>

</div><!-- =====================
     コピーする予定を選択
===================== --><div id="copySelectModal" class="modal"><div class="modal-content">

    <h3>
        コピーする予定を選択
    </h3>

    <div id="copyEventList"></div>

    <button onclick="copySelectedEvents()">
        📋 コピー
    </button>

    <button onclick="closeCopySelectModal()">
        ❌ キャンセル
    </button>

</div>

</div>
