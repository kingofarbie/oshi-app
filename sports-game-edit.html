<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>試合結果編集 | 推し活手帳</title>


    <link rel="stylesheet" href="calendar-sports.css">
<link rel="stylesheet" href="sports-baseball.css">

</head>

<body>

<div id="sportsGameEditScreen">

    <header class="sports-calendar-header">

        <h1
            id="sportsGameEditTitle"
            class="sports-calendar-title"
        >
            ⚾ 試合結果編集
        </h1>

        <button
            type="button"
            class="sports-back-button"
            onclick="closeSportsGameEditPage()"
        >
            ◀ カレンダーへ戻る
        </button>

    </header>


    <main
        id="sportsGameEditForm"
        class="sports-game-edit-form"
    >


        <!-- =========================
             チーム情報
        ========================== -->

        <section class="sports-edit-section">

            <h2>⚾ 試合情報</h2>


            <label for="sportsEditTeam">
                自分の応援チーム
            </label>

            <input
                type="text"
                id="sportsEditTeam"
                placeholder="応援チーム名"
                autocomplete="off"
            >


            <label for="sportsEditOpponent">
                相手チーム
            </label>

            <input
                type="text"
                id="sportsEditOpponent"
                placeholder="相手チーム名"
                autocomplete="off"
            >


            <label for="sportsEditStadium">
                📍 場所
            </label>

            <input
                type="text"
                id="sportsEditLocation"
                placeholder="球場・会場名"
                autocomplete="off"
            >

        </section>



<!-- =========================
     ⚾ スコアボード
========================== -->

<section class="sports-edit-section"><h2>📊 スコアボード</h2>

<div class="baseball-score-wrapper">

    <div class="baseball-score-scroll">

        <table class="baseball-score-table">

            <thead>
                <tr>

                    <th class="baseball-score-team">
                        回
                    </th>

                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                    <th>8</th>
                    <th>9</th>
                    <th>10</th>
                    <th>11</th>
                    <th>12</th>

                </tr>
            </thead>


            <tbody>

                <tr>

                    <th class="baseball-score-team">
                        応援チーム
                    </th>

                    <td>
                        <input
                            id="sportsEditTeamScore1"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore2"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore3"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore4"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore5"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore6"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore7"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore8"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore9"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore10"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore11"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditTeamScore12"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                </tr>


                <tr>

                    <th class="baseball-score-team">
                        相手チーム
                    </th>

                    <td>
                        <input
                            id="sportsEditOpponentScore1"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore2"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore3"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore4"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore5"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore6"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore7"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore8"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore9"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore10"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore11"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                    <td>
                        <input
                            id="sportsEditOpponentScore12"
                            class="baseball-score-input"
                            type="number"
                            min="0"
                            inputmode="numeric"
                        >
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</section>


        <!-- =========================
             試合結果
        ========================== -->

        <section class="sports-edit-section">

            <h2>🏆 試合結果</h2>


            <label for="sportsEditResult">
                勝敗
            </label>

            <select id="sportsEditResult">

                <option value="">
                    未設定
                </option>

                <option value="win">
                    🏆 勝ち
                </option>

                <option value="lose">
                    😢 負け
                </option>

                <option value="draw">
                    🤝 引分
                </option>

                <option value="cancelled">
                    ⛔ 中止
                </option>

            </select>

        </section>



        <!-- =========================
             先発投手
        ========================== -->

        <section class="sports-edit-section">

            <h2>⚾ 先発投手</h2>


            <label for="sportsEditTeamPitcher">
                応援チーム 先発投手
            </label>

            <input
                type="text"
                id="sportsEditStartingPitcher"
                placeholder="投手名"
                autocomplete="off"
            >


            <label for="sportsEditOpponentPitcher">
                相手チーム 先発投手
            </label>

            <input
                type="text"
                id="sportsEditOpponentPitcher"
                placeholder="投手名"
                autocomplete="off"
            >

        </section>



        <!-- =========================
             メモ
        ========================== -->

        <section class="sports-edit-section">

            <h2>📝 メモ</h2>

            <textarea
                id="sportsEditMemo"
                rows="5"
                placeholder="試合についてのメモ"
            ></textarea>

        </section>



        <!-- =========================
             ボタン
        ========================== -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                onclick="saveSportsGameEdit()"
            >
                💾 保存
            </button>

            <button
                type="button"
                onclick="cancelSportsGameEdit()"
            >
                キャンセル
            </button>

        </div>


    </main>

</div>

</body>

</html>
