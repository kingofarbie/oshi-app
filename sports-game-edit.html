<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>試合結果編集 | 推し活手帳</title>

</head>

<body>

<div id="sportsGameEditScreen">

    <header class="sports-calendar-header">

        <h1
            id="sportsGameEditTitle"
            class="sports-calendar-title"
        >
            🏟️ 試合結果編集
        </h1>

        <button
            type="button"
            class="sports-back-button"
            onclick="closeSportsGameEditPage()"
        >
            ◀ カレンダーへ戻る
        </button>

    </header>


    <main
        id="sportsGameEditForm"
        class="sports-game-edit-form"
    >

        <!-- =========================
             応援チーム
        ========================== -->

        <div class="sports-edit-section">

            <label>
                応援チーム
            </label>

            <input
                type="text"
                id="sportsEditTeam"
                placeholder="応援チーム名"
            >

        </div>


        <!-- =========================
             対戦相手
        ========================== -->

        <div class="sports-edit-section">

            <label>
                対戦相手
            </label>

            <input
                type="text"
                id="sportsEditOpponent"
                placeholder="対戦相手"
            >

        </div>


        <!-- =========================
             勝敗
        ========================== -->

        <div class="sports-edit-section">

            <label>
                勝敗
            </label>

            <select id="sportsEditResult">

                <option value="">
                    未設定
                </option>

                <option value="win">
                    🏆 勝ち
                </option>

                <option value="lose">
                    😢 負け
                </option>

                <option value="draw">
                    🤝 引き分け
                </option>

            </select>

        </div>


        <!-- =========================
             イニングスコア
        ========================== -->

        <div class="sports-edit-section">

            <label>
                ⚾ イニングスコア
            </label>


            <div class="sports-edit-score-table">

                <div class="sports-edit-score-header">

                    <span>回</span>
                    <span>応援チーム</span>
                    <span>相手</span>

                </div>


                <div class="sports-edit-score-row">
                    <span>1</span>
                    <input id="sportsEditTeamScore1" type="number" min="0">
                    <input id="sportsEditOpponentScore1" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>2</span>
                    <input id="sportsEditTeamScore2" type="number" min="0">
                    <input id="sportsEditOpponentScore2" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>3</span>
                    <input id="sportsEditTeamScore3" type="number" min="0">
                    <input id="sportsEditOpponentScore3" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>4</span>
                    <input id="sportsEditTeamScore4" type="number" min="0">
                    <input id="sportsEditOpponentScore4" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>5</span>
                    <input id="sportsEditTeamScore5" type="number" min="0">
                    <input id="sportsEditOpponentScore5" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>6</span>
                    <input id="sportsEditTeamScore6" type="number" min="0">
                    <input id="sportsEditOpponentScore6" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>7</span>
                    <input id="sportsEditTeamScore7" type="number" min="0">
                    <input id="sportsEditOpponentScore7" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>8</span>
                    <input id="sportsEditTeamScore8" type="number" min="0">
                    <input id="sportsEditOpponentScore8" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>9</span>
                    <input id="sportsEditTeamScore9" type="number" min="0">
                    <input id="sportsEditOpponentScore9" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>10</span>
                    <input id="sportsEditTeamScore10" type="number" min="0">
                    <input id="sportsEditOpponentScore10" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>11</span>
                    <input id="sportsEditTeamScore11" type="number" min="0">
                    <input id="sportsEditOpponentScore11" type="number" min="0">
                </div>

                <div class="sports-edit-score-row">
                    <span>12</span>
                    <input id="sportsEditTeamScore12" type="number" min="0">
                    <input id="sportsEditOpponentScore12" type="number" min="0">
                </div>

            </div>

        </div>


        <!-- =========================
             メモ
        ========================== -->

        <div class="sports-edit-section">

            <label>
                📝 メモ
            </label>

            <textarea
                id="sportsEditMemo"
                rows="5"
                placeholder="試合についてのメモ"
            ></textarea>

        </div>


        <!-- =========================
             ボタン
        ========================== -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                onclick="saveSportsGameEdit()"
            >
                💾 保存
            </button>

            <button
                type="button"
                onclick="cancelSportsGameEdit()"
            >
                キャンセル
            </button>

        </div>

    </main>

</div>

</body>

</html>
