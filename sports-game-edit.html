<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>試合結果編集 | 推し活手帳</title>

</head>

<body>

<div id="sportsGameEditScreen">

    <header class="sports-calendar-header">

        <h1
            id="sportsGameEditTitle"
            class="sports-calendar-title"
        >
            ⚾ 試合結果編集
        </h1>

        <button
            type="button"
            class="sports-back-button"
            onclick="closeSportsGameEditPage()"
        >
            ◀ カレンダーへ戻る
        </button>

    </header>


    <main
        id="sportsGameEditForm"
        class="sports-game-edit-form"
    >


        <!-- =========================
             チーム情報
        ========================== -->

        <section class="sports-edit-section">

            <h2>⚾ 試合情報</h2>


            <label for="sportsEditTeam">
                自分の応援チーム
            </label>

            <input
                type="text"
                id="sportsEditTeam"
                placeholder="応援チーム名"
                autocomplete="off"
            >


            <label for="sportsEditOpponent">
                相手チーム
            </label>

            <input
                type="text"
                id="sportsEditOpponent"
                placeholder="相手チーム名"
                autocomplete="off"
            >


            <label for="sportsEditStadium">
                📍 場所
            </label>

            <input
                type="text"
                id="sportsEditLocation"
                placeholder="球場・会場名"
                autocomplete="off"
            >

        </section>



        <!-- =========================
             スコアボード
        ========================== -->

        <section class="sports-edit-section">

            <h2>📊 スコアボード</h2>


            <div class="sports-edit-score-board">


                <!-- ヘッダー -->

                <div class="sports-score-row sports-score-header">

                    <div class="sports-score-inning">
                        回
                    </div>

                    <div>
                        応援チーム
                    </div>

                    <div>
                        相手
                    </div>

                </div>


                <!-- 1〜12回 -->

                <div class="sports-score-row">
                    <div class="sports-score-inning">1</div>
                    <input id="sportsEditTeamScore1" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore1" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">2</div>
                    <input id="sportsEditTeamScore2" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore2" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">3</div>
                    <input id="sportsEditTeamScore3" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore3" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">4</div>
                    <input id="sportsEditTeamScore4" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore4" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">5</div>
                    <input id="sportsEditTeamScore5" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore5" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">6</div>
                    <input id="sportsEditTeamScore6" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore6" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">7</div>
                    <input id="sportsEditTeamScore7" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore7" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">8</div>
                    <input id="sportsEditTeamScore8" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore8" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">9</div>
                    <input id="sportsEditTeamScore9" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore9" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">10</div>
                    <input id="sportsEditTeamScore10" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore10" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">11</div>
                    <input id="sportsEditTeamScore11" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore11" type="number" min="0" inputmode="numeric">
                </div>

                <div class="sports-score-row">
                    <div class="sports-score-inning">12</div>
                    <input id="sportsEditTeamScore12" type="number" min="0" inputmode="numeric">
                    <input id="sportsEditOpponentScore12" type="number" min="0" inputmode="numeric">
                </div>


                <!-- 合計 -->

                <div class="sports-score-row sports-score-total">

                    <div class="sports-score-inning">
                        計
                    </div>

                    <div id="sportsEditTeamTotal">
                        0
                    </div>

                    <div id="sportsEditOpponentTotal">
                        0
                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             試合結果
        ========================== -->

        <section class="sports-edit-section">

            <h2>🏆 試合結果</h2>


            <label for="sportsEditResult">
                勝敗
            </label>

            <select id="sportsEditResult">

                <option value="">
                    未設定
                </option>

                <option value="win">
                    🏆 勝ち
                </option>

                <option value="lose">
                    😢 負け
                </option>

                <option value="draw">
                    🤝 引分
                </option>

                <option value="cancelled">
                    ⛔ 中止
                </option>

            </select>

        </section>



        <!-- =========================
             先発投手
        ========================== -->

        <section class="sports-edit-section">

            <h2>⚾ 先発投手</h2>


            <label for="sportsEditTeamPitcher">
                応援チーム 先発投手
            </label>

            <input
                type="text"
                id="sportsEditStartingPitcher"
                placeholder="投手名"
                autocomplete="off"
            >


            <label for="sportsEditOpponentPitcher">
                相手チーム 先発投手
            </label>

            <input
                type="text"
                id="sportsEditOpponentPitcher"
                placeholder="投手名"
                autocomplete="off"
            >

        </section>



        <!-- =========================
             メモ
        ========================== -->

        <section class="sports-edit-section">

            <h2>📝 メモ</h2>

            <textarea
                id="sportsEditMemo"
                rows="5"
                placeholder="試合についてのメモ"
            ></textarea>

        </section>



        <!-- =========================
             ボタン
        ========================== -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                onclick="saveSportsGameEdit()"
            >
                💾 保存
            </button>

            <button
                type="button"
                onclick="cancelSportsGameEdit()"
            >
                キャンセル
            </button>

        </div>


    </main>

</div>

</body>

</html>
