<!-- =================================================
     ヘッダー
================================================== -->

<header class="sports-calendar-header">


    <h1
        id="baseballGameEditTitle"
        class="sports-calendar-title"
    >
        ⚾ 試合結果編集
    </h1>


    <button
        type="button"
        class="sports-back-button"
        onclick="closeSportsGameEditPage()"
    >
        ◀ カレンダーへ戻る
    </button>


</header>



<!-- =================================================
     編集フォーム
================================================== -->

<main
    id="baseballGameEditForm"
    class="sports-game-edit-form"
>



    <!-- =============================================
         ⚾ 試合情報
    ============================================== -->

    <section class="sports-edit-section">


        <h2>
            ⚾ 試合情報
        </h2>



        <!-- 応援チーム -->

        <label for="baseballEditTeam">
            自分の応援チーム
        </label>


        <input
            type="text"
            id="baseballEditTeam"
            placeholder="応援チーム名"
            autocomplete="off"
        >



        <!-- 相手チーム -->

        <label for="baseballEditOpponent">
            相手チーム
        </label>


        <input
            type="text"
            id="baseballEditOpponent"
            placeholder="相手チーム名"
            autocomplete="off"
        >



        <!-- 先攻・後攻 -->

        <label for="baseballEditBattingOrder">
            先攻・後攻
        </label>


        <select
            id="baseballEditBattingOrder"
        >

            <option value="">
                未設定
            </option>

            <option value="team_first">
                応援チームが先攻
            </option>

            <option value="opponent_first">
                応援チームが後攻
            </option>

        </select>



        <!-- 場所 -->

        <label for="baseballEditLocation">
            📍 場所
        </label>


        <input
            type="text"
            id="baseballEditLocation"
            placeholder="球場・会場名"
            autocomplete="off"
        >


    </section>




    <!-- =============================================
         📊 スコアボード
    ============================================== -->

        <h2>

            <div class="baseball-score-scroll">

                            <th>1</th>

                            <th>5</th>
                            <th>6</th>
                            <th>7</th>

                            >

                            </th>


                            <td>
                                <input
                                    type="number"

                        </tr>


                    </tbody>


                </table>


            </div>


        </div>



        <!-- =========================================
             合計スコア表示
        ========================================== -->

        <div
            id="baseballEditScorePreview"
            class="baseball-final-score"
        >


            <span id="baseballEditTeamPreview">
                応援チーム
            </span>


            <strong>
                0 - 0
            </strong>


            <span id="baseballEditFinalOpponent">
                相手チーム
            </span>


        </div>


    </section>




    <!-- =============================================
         🏆 試合結果
    ============================================== -->

    <section class="sports-edit-section">


        <h2>
            🏆 試合結果
        </h2>


        <label for="baseballEditResult">
            勝敗
        </label>


        <select
            id="baseballEditResult"
        >

            <option value="">
                未設定
            </option>

            <option value="win">
                🏆 勝ち
            </option>

            <option value="lose">
                😢 負け
            </option>

            <option value="draw">
                🤝 引分
            </option>

            <option value="cancelled">
                ⛔ 中止
            </option>

        </select>


    </section>




    <!-- =============================================
         ⚾ 先発投手
    ============================================== -->

    <section class="sports-edit-section">


        <h2>
            ⚾ 先発投手
        </h2>


        <label for="baseballEditStartingPitcher">
            応援チーム 先発投手
        </label>


        <input
            type="text"
            id="baseballEditStartingPitcher"
            placeholder="投手名"
            autocomplete="off"
        >



        <label for="baseballEditOpponentPitcher">
            相手チーム 先発投手
        </label>


        <input
            type="text"
            id="baseballEditOpponentPitcher"
            placeholder="投手名"
            autocomplete="off"
        >


    </section>




    <!-- =============================================
         📝 メモ
    ============================================== -->

    <section class="sports-edit-section">


        <h2>
            📝 メモ
        </h2>


        <textarea
            id="baseballEditMemo"
            rows="5"
            placeholder="試合についてのメモ"
        ></textarea>


    </section>




    <!-- =============================================
         💾 ボタン
    ============================================== -->

    <div class="sports-edit-buttons">


        <button
            type="button"
            onclick="saveBaseballGameFromEditPage()"
        >
            💾 保存
        </button>


        <button
            type="button"
            onclick="closeSportsGameEditPage()"
        >
            キャンセル
        </button>


    </div>
