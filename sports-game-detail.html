<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>試合結果 | 推し活手帳</title>


    <link
        rel="stylesheet"
        href="calendar-sports.css"
    >

</head>


<body>


<!-- =====================================================
     ⚾ 試合結果・詳細
===================================================== -->

<div
    id="sportsGameDetailScreen"
    class="sports-game-detail-screen"
>


    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="sports-calendar-header">

        <h1
            id="sportsGameDetailTitle"
            class="sports-calendar-title"
        >
            ⚾ 試合結果
        </h1>


        <button
            type="button"
            class="sports-back-button"
            onclick="openSportsCalendar()"
        >
            ◀ カレンダーへ戻る
        </button>

    </header>



    <!-- =========================
         試合詳細
    ========================== -->

    <main
        id="sportsGameDetail"
        class="sports-game-detail"
    >

    </main>


</div>



<!-- =====================================================
     JavaScript
===================================================== -->

<script src="sports-game-detail.js"></script>

</body>

</html>
