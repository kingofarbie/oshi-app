<!-- =====================
     ホーム
===================== -->

<div id="home" class="page active">

    <div class="card">

        <h2>⏰ 次の予定まで</h2>

        <div id="countdown-card" class="item">
            該当なし
        </div>

    </div>


    <div class="card">

        <h2>📅 本日の予定</h2>

        <div id="today-schedule" class="item">
            該当なし
        </div>

    </div>


    <div class="card">

        <h2>📌 直近のイベント</h2>

        <div id="upcoming-events" class="item">
            該当なし
        </div>

    </div>


    <!-- =====================
         お気に入り
    ===================== -->

    <div class="card favorite-home-card">

        <h2>
            ⭐ お気に入り
        </h2>


        <div class="favorite-summary">

            <div>
                📷 お気に入り写真
                <span id="favorite-photo-count">
                    0
                </span>
                枚
            </div>


            <div>
                🏆 ベストイベント
                <span id="favorite-event-count">
                    0
                </span>
                件
            </div>

        </div>


        <button
            onclick="switchTab('favoritePage',event)">
            ⭐ お気に入りを見る
        </button>

    </div>

</div>
