<!-- oshi-money.html -->

<div class="oshi-money-page">

    <!-- =====================
         ヘッダー
    ====================== -->

    <div class="oshi-money-header">

        <button
            type="button"
            onclick="closeOshiMoney()">

            ← お金へ戻る

        </button>

        <h2>⭐ 推し活費</h2>

    </div>

    ====================== -->

    ====================== -->
