<!-- =====================
     設定
===================== -->


<!--現在プラン表示--> 
<div class="card">

<p id="current-plan">
</p>

</div>


<!--設定タイトル--> 
<h2 class="settings-title">
設定
</h2>



<!--プラン-->
<div class="card setting-item">


<button onclick="toggleSetting('planMenu')">

<span id="planIcon">＋</span>
プラン

</button>


<div id="planMenu" class="setting-content" style="display:none;">

<div id="planList"></div>

</div>

</div>




<!--背景テーマ-->
<div class="card setting-item">


<button onclick="toggleSetting('themeMenu')">

<span id="themeIcon">＋</span>
背景テーマ

</button>

<div id="currentTheme">
    現在：⚪ Basic
</div>

<div id="themeMenu" class="setting-content" style="display:none;">

<button onclick="setTheme('basic')">
⚪ Basic
</button>

<button onclick="setTheme('neon-pink')">
🩷 Pink
</button>

<button onclick="setTheme('neon-blue')">
💙 Blue
</button>

<button onclick="setTheme('neon-purple')">
💜 Purple
</button>

<button onclick="setTheme('neon-green')">
💚 Green
</button>

<button onclick="setTheme('neon-orange')">
🧡 Orange
</button>

<button onclick="setTheme('love')">
💕 恋愛
</button>

<button onclick="setTheme('space')">
🌌 宇宙
</button>

<button onclick="setTheme('dreamy-star')">
🌌 ゆめかわ星空
</button>

</div>

</div>




<!-- =====================
     祝日設定
===================== -->

<div class="card setting-item">

    <button onclick="toggleSetting('holidayMenu')">

        <span id="holidayIcon">＋</span>
        📅 祝日設定

    </button>

    <div
        id="holidayMenu"
        class="setting-content"
        style="display:none;">

        <p>
            祝日を表示する国・地域を設定します
        </p>

        <label for="holidayCountry">
            国・地域
        </label>

<select id="holidayCountry">
    <option value="">
        国・地域を読み込み中...
    </option>
</select>

    </div>

</div>


<!-- =====================
     🎂 記念日・誕生日設定
===================== -->

<div class="card setting-item">

    <button
        type="button"
        onclick="toggleSetting('anniversaryMenu')">

        <span id="anniversaryIcon">＋</span>
        🎂 記念日・誕生日

    </button>

    <div
        id="anniversaryMenu"
        class="setting-content"
        style="display:none;">

        <p>
            誕生日や記念日を登録できます。
        </p>

        <button
            type="button"
            onclick="openAnniversaryPage()">

            🎂 記念日・誕生日を管理

        </button>

    </div>

</div>

<!--通知設定--> 
<div class="card setting-item">


<button onclick="toggleSetting('notificationMenu')">

<span id="notificationIcon">＋</span>
通知設定

</button>




<div id="notificationMenu"
class="setting-content"
style="display:none;">


<p>
📅 前日通知
</p>

<button
onclick="toggleNotification('before')"
id="beforeNotificationBtn">

OFF

</button>

<input
type="time"
id="beforeNotificationTime"
value="20:00">



<hr>



<p>
🔔 当日通知
</p>

<button
onclick="toggleNotification('today')"
id="todayNotificationBtn">

OFF

</button>

<input
type="time"
id="todayNotificationTime"
value="09:00">



<hr>



<p>
⏰ 開始前通知
</p>

<button
onclick="toggleNotification('start')"
id="startNotificationBtn">

OFF

</button>


<select
id="startNotificationMinutes">

<option value="5">
5分前
</option>

<option value="10">
10分前
</option>

<option value="15">
15分前
</option>

<option value="30">
30分前
</option>

<option value="60">
1時間前
</option>

</select>

</div>

</div>



<!-- =====================
     ⭐ お気に入り写真設定
===================== -->
<div class="card setting-item">

    <button
        type="button"
        onclick="toggleSetting('favoritePhotoMenu')">

        <span id="favoritePhotoIcon">＋</span>
        ⭐ お気に入り写真

    </button>


    <div
        id="favoritePhotoMenu"
        class="setting-content"
        style="display:none;">

        <p>
            ホームに表示するお気に入り写真を設定します。
        </p>


        <!-- 表示枚数 -->
        <div class="favorite-setting-row">

            <label for="favoritePhotoCount">
                🖼 表示枚数
            </label>

            <select id="favoritePhotoCount">

                <option value="1">1枚</option>
                <option value="2">2枚</option>
                <option value="3">3枚</option>
                <option value="4">4枚</option>
                <option value="5">5枚</option>
                <option value="6">6枚</option>
                <option value="7">7枚</option>
                <option value="8">8枚</option>
                <option value="9">9枚</option>
                <option value="10">10枚</option>
                <option value="all">すべて</option>

            </select>

        </div>


        <!-- 表示時間 -->
        <div class="favorite-setting-row">

            <label for="favoritePhotoInterval">
                ⏱ 1枚の表示時間
            </label>

            <select id="favoritePhotoInterval">

                <option value="3000">3秒</option>
                <option value="5000">5秒</option>
                <option value="7000">7秒</option>
                <option value="10000">10秒</option>

            </select>

        </div>


        <!-- フェイド -->
        <div class="favorite-setting-row">

            <span>
                ✨ フェイドイン・アウト
            </span>

            <button
                type="button"
                id="favoritePhotoFadeBtn"
                class="favorite-fade-btn"
                onclick="toggleFavoritePhotoFade()">

                🟢 ON

            </button>

        </div>

    </div>

</div>


<!-- =====================
     持ち物テンプレート
===================== -->

<div class="card setting-item">

<button onclick="toggleSetting('templateMenu')">

<span id="templateIcon">＋</span>
👜 持ち物テンプレート

</button>

<div id="templateMenu"
class="setting-content"
style="display:none;">

<div id="template-list">
テンプレートはありません
</div>

<hr>

<input
type="text"
id="template-name"
placeholder="テンプレート名（例：ライブ）">

<button onclick="addTemplate()">
➕ テンプレート追加
</button>

</div>

</div>




<!-- =====================
     カテゴリ管理
===================== -->

<div class="card setting-item">


<button onclick="toggleSetting('categoryMenu')">

<span id="categoryIcon">＋</span>
🏷 カテゴリ管理

</button>



<div id="categoryMenu"
class="setting-content"
style="display:none;">





<p>
予定を分類するカテゴリを管理できます
</p>



<div id="category-list">

現在カテゴリなし

</div>

<hr>
<input
type="text"
id="category-name"
placeholder="カテゴリ名（例：推し活、仕事、旅行）">

<select id="category-icon">

<option value="📌">📌 その他</option>
<option value="⭐">⭐ 推し</option>
<option value="🎤">🎤 音楽・ライブ</option>
<option value="🎵">🎵 音楽</option>
<option value="⚽">⚽ スポーツ</option>
<option value="🏥">🏥 病院</option>
<option value="💼">💼 仕事</option>
<option value="✈️">✈️ 旅行</option>
<option value="🎁">🎁 プレゼント</option>
<option value="❤️">❤️ 大切</option>
<option value="💕">💕 恋愛</option>

</select>


<select id="category-color">

<option value="#ff66aa">
🩷 ピンク
</option>

<option value="#3399ff">
💙 ブルー
</option>

<option value="#33cc66">
💚 グリーン
</option>

<option value="#9966ff">
💜 パープル
</option>

<option value="#ff9933">
🧡 オレンジ
</option>

</select>

<button onclick="addCategory()">
➕ カテゴリ追加
</button>


</div>


</div>

<!-- =====================
     アプリ更新
===================== -->

<div class="card setting-item">

<button onclick="checkLatestVersion(true)">

    🔍 更新確認

</button>

<div id="appVersion"></div>

</div>



<!-- =====================
     アプリ更新モーダル
===================== -->

<div id="updateModal" class="modal">

    <div class="modal-content">

        <h2>🔄 アプリ更新</h2>

        <p id="updateMessage"></p>

        <button id="updateButton" onclick="startUpdate()" style="display:none;">
            🔄 更新する
        </button>

        <button onclick="closeUpdateModal()">
            あとで
        </button>

    </div>

</div>
