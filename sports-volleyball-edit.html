<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>🏐 バレー試合編集</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="sports-volleyball.css">

</head>


<body class="theme-basic">


<div class="sports-edit-page">


    <!-- =================================================
         タイトル
    ================================================= -->

    <div class="sports-edit-header">

        <h1>
            🏐 バレー試合編集
        </h1>

    </div>


    <!-- =================================================
         編集フォーム
    ================================================= -->

    <div class="sports-edit-form">


        <!-- =========================
             試合日
        ========================== -->

        <div class="sports-edit-field">

            <label for="volleyballGameDate">
                📅 試合日
            </label>

            <input
                type="date"
                id="volleyballGameDate"
            >

        </div>


        <!-- =========================
             応援チーム
        ========================== -->

        <div class="sports-edit-field">

            <label>
                🏐 応援チーム
            </label>

            <input
                type="text"
                id="volleyballTeam"
                readonly
            >

        </div>


        <!-- =========================
             対戦相手
        ========================== -->

        <div class="sports-edit-field">

            <label for="volleyballOpponent">
                ⚔️ 対戦相手
            </label>

            <input
                type="text"
                id="volleyballOpponent"
                placeholder="対戦相手を入力"
            >

        </div>


        <!-- =========================
             会場
        ========================== -->

        <div class="sports-edit-field">

            <label for="volleyballLocation">
                📍 会場
            </label>

            <input
                type="text"
                id="volleyballLocation"
                placeholder="会場名を入力"
            >

        </div>


        <!-- =================================================
             セットスコア
        ================================================= -->

        <div class="volleyball-edit-section">

            <div class="volleyball-edit-section-title">
                🏐 セットスコア
            </div>


            <!-- 第1セット -->

            <div class="volleyball-set-row">

                <div class="volleyball-set-title">
                    第1セット
                </div>

                <input
                    type="number"
                    id="volleyballTeamScore1"
                    min="0"
                    inputmode="numeric"
                    placeholder="応援"
                >

                <span>
                    -
                </span>

                <input
                    type="number"
                    id="volleyballOpponentScore1"
                    min="0"
                    inputmode="numeric"
                    placeholder="相手"
                >

            </div>


            <!-- 第2セット -->

            <div class="volleyball-set-row">

                <div class="volleyball-set-title">
                    第2セット
                </div>

                <input
                    type="number"
                    id="volleyballTeamScore2"
                    min="0"
                    inputmode="numeric"
                    placeholder="応援"
                >

                <span>
                    -
                </span>

                <input
                    type="number"
                    id="volleyballOpponentScore2"
                    min="0"
                    inputmode="numeric"
                    placeholder="相手"
                >

            </div>


            <!-- 第3セット -->

            <div class="volleyball-set-row">

                <div class="volleyball-set-title">
                    第3セット
                </div>

                <input
                    type="number"
                    id="volleyballTeamScore3"
                    min="0"
                    inputmode="numeric"
                    placeholder="応援"
                >

                <span>
                    -
                </span>

                <input
                    type="number"
                    id="volleyballOpponentScore3"
                    min="0"
                    inputmode="numeric"
                    placeholder="相手"
                >

            </div>


            <!-- 第4セット -->

            <div class="volleyball-set-row">

                <div class="volleyball-set-title">
                    第4セット
                </div>

                <input
                    type="number"
                    id="volleyballTeamScore4"
                    min="0"
                    inputmode="numeric"
                    placeholder="応援"
                >

                <span>
                    -
                </span>

                <input
                    type="number"
                    id="volleyballOpponentScore4"
                    min="0"
                    inputmode="numeric"
                    placeholder="相手"
                >

            </div>


            <!-- 第5セット -->

            <div class="volleyball-set-row">

                <div class="volleyball-set-title">
                    第5セット
                </div>

                <input
                    type="number"
                    id="volleyballTeamScore5"
                    min="0"
                    inputmode="numeric"
                    placeholder="応援"
                >

                <span>
                    -
                </span>

                <input
                    type="number"
                    id="volleyballOpponentScore5"
                    min="0"
                    inputmode="numeric"
                    placeholder="相手"
                >

            </div>

        </div>


        <!-- =================================================
             結果
        ================================================= -->

        <div class="sports-edit-field">

            <label for="volleyballResult">
                🏆 結果
            </label>

            <select id="volleyballResult">

                <option value="">
                    選択してください
                </option>

                <option value="win">
                    🏆 勝ち
                </option>

                <option value="lose">
                    😢 負け
                </option>

                <option value="draw">
                    🤝 引き分け
                </option>

                <option value="cancelled">
                    ⛔ 中止
                </option>

            </select>

        </div>


        <!-- =================================================
             メモ
        ================================================= -->

        <div class="sports-edit-field">

            <label for="volleyballMemo">
                📝 メモ
            </label>

            <textarea
                id="volleyballMemo"
                rows="5"
                placeholder="試合についてのメモ"
            ></textarea>

        </div>


        <!-- =================================================
             ボタン
        ================================================= -->

        <div class="sports-edit-buttons">

            <button
                type="button"
                onclick="saveVolleyballGameFromEditPage()"
            >
                💾 保存
            </button>


<button
    type="button"
    onclick="closeSportsGameEditPage()"
>
                ❌ キャンセル
            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     JavaScript
===================================================== -->

<script src="storage.js"></script>
<script src="sports-volleyball.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderVolleyballGameEditForm();

    }
);

</script>


</body>

</html>
