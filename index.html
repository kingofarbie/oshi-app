<body class="theme-basic">
    
<div class="header">

    <button
        id="homeMenuButton"
        onclick="toggleHomeMenu()"
        aria-label="メニュー">
        ☰
    </button>

    <h1>〇〇手帳</h1>

</div>

<!-- =====================
     ホーム
===================== -->


<div id="home" class="page active"></div>

<div id="homeMenuContainer"></div>


<!-- =====================
     カレンダー
===================== -->

<div id="calendarPage" class="page">

    <div id="calendarContainer">
        <!-- calendar.html をここに読み込む -->
    </div>

</div>

<!-- =====================
     1日手帳
===================== -->

<div id="plannerPage" class="page">

    <div id="plannerContainer">

        <!-- planner.html をここに読み込む -->

    </div>

</div>



<!-- =====================
     お気に入りページ
===================== -->

<div id="favoritePage" class="page">


<div class="card">

<h2>
⭐ お気に入り
</h2>


<button onclick="switchTab('home',event)">
← ホームへ戻る
</button>


</div>



<div class="card">

<h3>
📷 お気に入り写真
</h3>


<div
id="favorite-photo-list"
class="memory-list">

写真はありません

</div>


</div>



<div class="card">

<h3>
🏆 ベストイベント
</h3>


<div
id="favorite-event-list">

イベントはありません

</div>


</div>



</div>





<!--- =====================
     イベント入力ポップアップ
===================== -->

<div id="eventFormModal" class="modal"><div class="modal-content event-modal">

    <h2 id="eventFormTitle">
        ➕ 予定追加
    </h2>

    <div class="event-form-row">
        <label for="event-category">種類</label>
        <select id="event-category">
            <option value="イベント">🎫 イベント</option>
            <option value="フェス">🎵 フェス</option>
            <option value="試合">⚽ 試合</option>
        </select>
    </div>

<div class="event-form-row">
    <label for="event-title">イベント名</label>
    <input
        type="text"
        id="event-title"
        placeholder="イベント名">
</div>

    <div class="event-form-row">
        <label for="event-start">開始時間</label>
        <input
            type="datetime-local"
            id="event-start">
    </div>

    <div class="event-form-row">
        <label for="event-end">終了時間</label>
        <input
            type="datetime-local"
            id="event-end">
    </div>

    <div class="event-form-row">
        <label for="meeting-time">待ち合わせ</label>
        <input
            type="time"
            id="meeting-time">
    </div>

    <div class="event-form-row">
        <label for="event-place">場所</label>
        <input
            type="text"
            id="event-place"
            placeholder="場所">
    </div>

    <div class="event-form-row">
        <label for="companions">同伴者</label>
        <input
            type="text"
            id="companions"
            placeholder="同伴者">
    </div>

    <div class="event-form-row">
        <label for="map-url">地図</label>
        <input
            type="url"
            id="map-url"
            placeholder="GoogleマップURL">
    </div>

    <div class="event-form-row">
        <label for="ticket-url">チケット</label>
        <input
            type="url"
            id="ticket-url"
            placeholder="チケットURL">
    </div>

    <hr>

    <h3>📦 テンプレート</h3>

    <div class="template-select-area">
        <select id="templateSelect" onchange="applyTemplate()">
            <option value="">テンプレートを選択</option>
        </select>
    </div>

    <h3>👜 持ち物リスト</h3>

    <div id="checklistContainer" class="checklist-list">
        <div class="checklist-empty">
            持ち物はありません
        </div>
    </div>

    <div class="checklist-add">

        <input
            type="text"
            id="newChecklistItem"
            placeholder="持ち物を入力">

        <button
            type="button"
            class="save-btn"
            onclick="addChecklistItem()">
            ➕追加
        </button>

    </div>

    <div class="event-modal-buttons">

        <button
            type="button"
            onclick="saveEvent()">
            💾 保存
        </button>

        <button
            type="button"
            onclick="closeEventModal()">
            キャンセル
        </button>

    </div>

</div>

</div>


<!-- =====================
     イベント詳細モーダル
===================== -->

<div id="eventDetailModal" class="modal">

    <div class="modal-content">

        <h2 id="detail-title">
            イベント詳細
        </h2>

        <div id="detail-content"></div>

<h3>👜 持ち物リスト</h3>

<div id="detail-checklist">

まだ登録されていません

</div>


        <div class="event-button-area">

            <button
                id="detailMapBtn"
                class="map-btn"
                style="display:none;">
                🗺 地図
            </button>

            <button
                id="detailTicketBtn"
                class="map-btn"
                style="display:none;">
                🎫 チケット
            </button>

        </div>

        <div class="event-button-area">

            <button
                onclick="editCurrentEvent()">
                ✏️ 編集
            </button>

            <button
                onclick="deleteCurrentEvent()">
                🗑 削除
            </button>

        </div>

        <button onclick="closeEventDetail()">
            ❌ 閉じる
        </button>

    </div>

</div>



<!-- =====================
     推し
===================== -->

<div id="oshiPage" class="page">

    <div id="oshiContainer"></div>

</div>

<!-- =====================
     💰 お金
===================== -->

<div id="moneyPage" class="page">

    <div id="moneyContainer">

        <!-- money.html をここに読み込む -->

    </div>

</div>
<!-- =====================
     🎂 記念日・誕生日ページ
===================== -->
<div id="anniversaryPage" class="page">

    <div id="anniversaryContainer">
       
    </div>

</div>


<!-- =====================
     テンプレート編集
===================== -->

<div id="templateEditorModal" class="modal">

    <div class="modal-content event-modal">

        <h2 id="templateEditorTitle">
            持ち物テンプレート
        </h2>

        <div id="templateEditorList">

        </div>

        <div class="checklist-add">

            <input
                type="text"
                id="newTemplateItem"
                placeholder="持ち物を入力">

            <button
                type="button"
                onclick="addTemplateItem()">

                ➕追加

            </button>

        </div>

        <button onclick="saveTemplate()">

            💾 保存

        </button>

        <button onclick="closeTemplateEditor()">

            キャンセル

        </button>

    </div>

</div>



<!-- =====================
     タブ
===================== -->
<div class="tabbar">
    <!-- ホーム -->
<div
    class="tab active"
    onclick="switchTab('home',event)">

    🏠<br>
    ホーム

</div>


<!-- 1日手帳 -->
<div
    class="tab"
    onclick="switchTab('plannerPage',event)">

    📖<br>
    1日手帳

</div>


<!-- カレンダー -->
<div
    class="tab"
    onclick="switchTab('calendarPage',event)">

    📅<br>
    カレンダー

</div>


<!-- 推し -->
<div
    class="tab"
    onclick="switchTab('oshiPage',event)">

    ⭐<br>
    推し

</div>


<!-- お金 -->
<div
    class="tab"
    onclick="switchTab('moneyPage',event)">

    💰<br>
    お金

</div>

</div>

<div
    id="photoViewer"
    class="photo-viewer"
    style="display: none;"
    ontouchstart="touchStartX = event.touches[0].clientX"
    ontouchend="photoSwipe(event)">

<button
    class="photo-favorite"
    onclick="toggleFavoritePhoto()">
    ☆
</button>


<button
    class="photo-share"
    onclick="shareCurrentPhoto()">
    📤
</button>


<button
    class="photo-delete"
    onclick="deleteCurrentPhoto()">
    🗑
</button>


<button
    class="photo-close"
    onclick="closePhotoViewer()">
    ✕
</button>


    <img
        id="photoViewerImage"
        ontouchstart="photoDragStart(event)"
        ontouchmove="photoPinch(event)"
ontouchend="photoDragEnd(event);photoDoubleTap(event)">

</div>



<div id="photoSortMenu" class="photo-sort-menu" style="display:none;">

<button onclick="setPhotoSort('new')">
🆕 新しい順
</button>

<button onclick="setPhotoSort('old')">
📜 古い順
</button>

<button onclick="setPhotoSort('favoriteNew')">
⭐ お気に入り順（新しい順）
</button>

<button onclick="setPhotoSort('favoriteOld')">
⭐ お気に入り順（古い順）
</button>

<button onclick="setPhotoSort('free')">
✋ 自由
</button>

<button onclick="closePhotoSortMenu()">
❌ 閉じる
</button>

</div>
