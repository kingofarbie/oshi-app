<script>
function openExternalBrowser() {

    const url = window.location.href;

    const ua = navigator.userAgent || "";

    /*
     * Androidの場合
     * Chromeを外部ブラウザとして起動するよう試みる
     */
    if (/Android/i.test(ua)) {

        try {

            const urlObj = new URL(url);

            const intentUrl =
                "intent://" +
                urlObj.host +
                urlObj.pathname +
                urlObj.search +
                urlObj.hash +
                "#Intent;" +
                "scheme=https;" +
                "package=com.android.chrome;" +
                "end";

            window.location.href = intentUrl;

            return;

        } catch (e) {

            console.log(
                "Android外部ブラウザ起動に失敗:",
                e
            );

        }

    }


    /*
     * iPhone / iPad / その他
     *
     * 新しいウィンドウとして開く
     */
    const newWindow =
        window.open(url, "_blank");

    /*
     * LINE側にブロックされた場合の保険
     */
    if (!newWindow) {

        alert(
            "外部ブラウザを開けませんでした。\n\n" +
            "LINEのメニューから「ブラウザで開く」を選択してください。"
        );

    }

}
</script>




<script>
(function () {

    const savedLastPage =
        localStorage.getItem("oshi_last_page");

    if (savedLastPage) {

        const savedPage =
            document.getElementById(savedLastPage);

        if (savedPage) {

            document
                .querySelectorAll(".page")
                .forEach(page => {
                    page.classList.remove("active");
                });

            savedPage.classList.add("active");

        }

    }

    document.body.classList.remove("preloading");

})();
</script>
